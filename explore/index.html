            \u003cspan class=\"ff-total-val\" id=\"calcResultTotal\">$7.00\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"ff-calc-footnote\">\n        Đơn dưới 800 g áp dụng gói All-in-one. Ước tính chỉ để tham khảo, chi phí cuối cùng được xác nhận theo đơn thực tế.\n      \u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 5. INSIDE HOUSTON WAREHOUSE -->\n  \u003csection class=\"ff-warehouse-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-warehouse-header\">\n        \u003cdiv>\n          \u003cspan class=\"ff-tag-eyebrow\">HÌNH ẢNH KHO BÃI\u003c/span>\n          \u003ch2 class=\"ff-section-title\">Bên trong kho Houston.\u003c/h2>\n        \u003c/div>\n        \u003cdiv class=\"ff-gallery-nav\">\n          \u003cbutton class=\"ff-gallery-arrow\" onclick=\"slideGallery(-1)\" aria-label=\"Ảnh trước\">←\u003c/button>\n          \u003cbutton class=\"ff-gallery-arrow\" onclick=\"slideGallery(1)\" aria-label=\"Ảnh sau\">→\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-warehouse-slider-frame\" id=\"warehouseGallery\">\n        \u003c!-- Slide 0 -->\n        \u003cdiv class=\"ff-warehouse-slide active\" data-slide=\"0\">\n          \u003cimg src=\"assets/port_sunset_hero.jpg\" alt=\"Khu kệ lưu trữ kho Houston\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/warehouse_racks_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Khu kệ lưu trữ\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Khu vực lưu kho theo vị trí kệ, mỗi SKU gắn với một vị trí cố định trên OMS.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Slide 1 -->\n        \u003cdiv class=\"ff-warehouse-slide\" data-slide=\"1\">\n          \u003cimg src=\"assets/warehouse_hero.jpg\" alt=\"Bàn đóng gói &amp; Kiểm soát camera\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/warehouse_racks_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Bàn đóng gói &amp; Kiểm soát camera\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Mỗi kiện hàng được đóng gói dưới camera độ phân giải cao ghi hình đồng bộ tracking.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Slide 2 -->\n        \u003cdiv class=\"ff-warehouse-slide\" data-slide=\"2\">\n          \u003cimg src=\"assets/warehouse_racks_hero.jpg\" alt=\"Khu tiếp nhận &amp; Dock xuất hàng\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/port_sunset_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Khu tiếp nhận &amp; Dock xuất hàng\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Khu vực xuất nhập hàng liên tục kết nối trực tiếp các đơn vị vận chuyển USPS, UPS, FedEx.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-slider-dots\">\n        \u003cspan class=\"ff-dot active\" onclick=\"setSlide(0)\">\u003c/span>\n        \u003cspan class=\"ff-dot\" onclick=\"setSlide(1)\">\u003c/span>\n        \u003cspan class=\"ff-dot\" onclick=\"setSlide(2)\">\u003c/span>\n      \u003c/div>\n\n      \u003cp class=\"ff-warehouse-footnote\">\n        Ảnh minh họa tạm thời, sẽ thay bằng ảnh chụp thực tế tại kho Houston.\n      \u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 6. SERVICE POLICY SECTION -->\n  \u003csection class=\"ff-policy-section\" id=\"chinh-sach-fulfillment\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">CHÍNH SÁCH DỊCH VỤ\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Chính sách Fulfillment\u003c/h2>\n        \u003cp class=\"ff-section-sub\">\n          Các trường hợp dưới đây được xem xét dựa trên thông tin đơn hàng, chứng từ hợp lệ và kết quả đối soát giữa khách hàng, kho SpeeGo và đơn vị vận chuyển.\n        \u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-policy-list\">\n        \u003c!-- Item 01 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">01\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Hàng hóa trong kho bị thất lạc\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Trường hợp đối soát kho xác nhận hàng hóa bị thất lạc trong quá trình lưu kho, SpeeGo đền bù theo giá trị khai báo hoặc giá trị mua hàng thực tế của khách hàng căn cứ theo hóa đơn hợp lệ.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 02 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">02\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Kho đóng gói sai\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Nếu kho gửi sai SKU hoặc thiếu số lượng do lỗi pick &amp; pack (đối soát qua video đóng gói), SpeeGo chịu toàn bộ phí ship gửi bù hoặc thu hồi sản phẩm về kho.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 03 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">03\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Sai thông tin label hoặc địa chỉ giao hàng\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Trường hợp in sai label do hệ thống SpeeGo, đơn hàng được xử lý in lại và chuyển tiếp miễn phí. Khách hàng cập nhật sai địa chỉ sẽ hỗ trợ liên hệ hãng vận chuyển điều hướng theo chính sách hãng.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 04 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">04\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Hàng hư hỏng khi đóng gói hoặc vận chuyển nội địa\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>SpeeGo hỗ trợ mở claim khiếu nại bảo hiểm với đơn vị vận chuyển (USPS/UPS/FedEx) và phối hợp bồi hoàn nhanh chóng nhất cho chủ hàng.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 05 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">05\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Đơn báo \"Delivered\" nhưng người nhận chưa nhận hàng\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Hỗ trợ kiểm tra tọa độ GPS giao hàng của bưu tá và gửi yêu cầu xác minh vị trí giao hàng chi tiết từ hãng bưu chính trong vòng 24-48 giờ làm việc.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 06 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">06\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Đơn hàng giao chậm so với SLA\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Đối với đơn hàng SpeeGo không xuất kho đúng thời gian cam kết (SLA), khách hàng sẽ được hoàn 100% phí xử lý fulfillment của đơn hàng đó.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2 Claim Info Cards -->\n      \u003cdiv class=\"ff-claim-info-grid\">\n        \u003cdiv class=\"ff-claim-card\">\n          \u003cdiv class=\"ff-claim-card-tag\">TIẾP NHẬN KHIẾU NẠI\u003c/div>\n          \u003cdiv class=\"ff-claim-card-title\">Thời hạn gửi yêu cầu\u003c/div>\n          \u003cdiv class=\"ff-claim-card-desc\">\n            \u003cstrong>Mất đơn hàng:\u003c/strong> Trong vòng 2 tháng kể từ ngày đơn được đơn vị vận chuyển chấp nhận.\u003cbr>\n            \u003cstrong>Hư hỏng, sai giá cước hoặc vấn đề với hàng hóa:\u003c/strong> Trong vòng 3 ngày kể từ ngày đơn được giao cho người nhận.\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-claim-card\">\n          \u003cdiv class=\"ff-claim-card-tag\">THỜI GIAN XỬ LÝ\u003c/div>\n          \u003cdiv class=\"ff-claim-big-time\">10 ngày làm việc\u003c/div>\n          \u003cdiv class=\"ff-claim-card-desc\">\n            Tính từ thời điểm tiếp nhận đầy đủ hồ sơ khiếu nại trong quá trình vận chuyển.\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 7. FREQUENTLY ASKED QUESTIONS SECTION -->\n  \u003csection class=\"ff-faq-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">THÔNG TIN HỮU ÍCH\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Câu hỏi thường gặp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-faq-list\">\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Làm thế nào để tạo yêu cầu nhập kho?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Doanh nghiệp tạo Inbound Request (IR) trực tiếp trên giao diện phần mềm OMS SpeeGo, chọn danh sách SKU, số lượng dự kiến và dán mã kiện hàng được cung cấp lên thùng trước khi xuất sang kho Houston.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>SpeeGo hỗ trợ barcode như thế nào?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo hỗ trợ cấp mã barcode chuẩn hóa quốc tế hoặc sử dụng mã vạch có sẵn của khách hàng. Chúng tôi cung cấp file PDF template in nhãn và có dịch vụ dán barcode tại kho nếu nhà máy chưa dán kịp.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Tôi theo dõi tồn kho và đơn hàng ở đâu?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Tất cả dữ liệu tồn kho, trạng thái đơn hàng và lịch sử vận chuyển đều được đồng bộ thời gian thực 24/7 trên hệ thống quản lý OMS trực tuyến của SpeeGo.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Có thể kiểm tra lại quá trình đóng gói không?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Có. SpeeGo trang bị camera độ nét cao tại từng bàn đóng gói, lưu trữ video theo từng tracking ID đơn hàng để đối soát minh bạch khi có phát sinh.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Những đơn vị nào vận chuyển đơn hàng?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo hợp tác trực tiếp với các đơn vị vận chuyển hàng đầu nước Mỹ gồm USPS (ưu tiên dịch vụ Ground Advantage chi phí tối ưu), UPS và FedEx.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Hàng hoàn về được xử lý thế nào?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Khi hàng bị hoàn (return), kho Houston tiếp nhận, kiểm tra tình trạng sản phẩm, chụp ảnh báo cáo lên OMS và nhập lại kho để bán tiếp theo chỉ định của quý khách mà không tính thêm phí tiếp nhận.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 8. TESTIMONIAL SECTION -->\n  \u003csection class=\"ff-testimonial-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">KHÁCH HÀNG SPEEGO\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Đồng hành cùng doanh nghiệp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-testimonial-card\">\n        \u003cdiv class=\"ff-quote-mark\" aria-hidden=\"true\">\n          \u003cspan>\u003c/span>\u003cspan>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ff-quote-body\">\n          \u003cblockquote class=\"ff-quote-text\">\n            “Việc theo dõi OMS theo thời gian thực và chính sách không có chi phí ẩn khiến SpeeGo trở thành đối tác chuỗi cung ứng đáng tin cậy của chúng tôi.”\n          \u003c/blockquote>\n          \u003cdiv class=\"ff-author-info\">\n            \u003cdiv class=\"ff-author-name\">Sarah Mitchell\u003c/div>\n            \u003cdiv class=\"ff-author-title\">Operations Director, EcoLiving Home · Australia\u003c/div>\n            \u003cdiv class=\"ff-author-ref\">\n              \u003ca href=\"#/sourcing\" class=\"ff-ref-link\">Theo chia sẻ trên website SpeeGo · bản dịch tiếng Việt ↗\u003c/a>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 9. BAND CONSULTATION FORM -->\n  \u003cdiv data-component=\"cta-form\" data-variant=\"band\" id=\"contact-form\">\u003c/div>\n\n  \u003cscript>\n    if (typeof window.initWarehouseGallery === 'function') {\n      window.initWarehouseGallery();\n    }\n  \u003c/script>\n\n\u003c/div>\n", "pages/sourcing/sourcing.html": "\u003c!-- ==========================================================================\n     PAGE: SOURCING (Tìm nguồn hàng & kiểm soát chất lượng) - REFACTORED\n     Metadata:\n     data-page=\"sourcing\"\n     data-nav=\"sourcing\"\n     data-breadcrumb='[{\"label\":\"Trang chủ\",\"href\":\"#/sourcing\"},{\"label\":\"Sourcing & kiểm soát chất lượng\",\"href\":\"#/sourcing\"}]'\n     ========================================================================== -->\n\u003cdiv class=\"page-container\" \n     data-page=\"sourcing\" \n     data-nav=\"sourcing\" \n     data-breadcrumb='[{\"label\":\"Trang chủ\",\"href\":\"#/sourcing\"},{\"label\":\"Sourcing & kiểm soát chất lượng\",\"href\":\"#/sourcing\"}]'>\n\n  \u003c!-- 1. HERO SECTION (2 CỘT) -->\n  \u003csection class=\"hero-section\">\n    \u003cdiv class=\"container hero-grid\">\n      \u003c!-- Cột trái: Text & 2 CTA -->\n      \u003cdiv class=\"hero-left\">\n        \u003cspan class=\"hero-badge\">SOURCING &amp; QUALITY CONTROL\u003c/span>\n        \u003ch1 class=\"hero-title\">\n          Tìm nguồn hàng &amp;\u003cbr>\n          kiểm soát chất lượng\u003cbr>\n          \u003cspan class=\"highlight-orange\">toàn diện.\u003c/span>\n        \u003c/h1>\n        \u003cp class=\"hero-desc\">\n          SpeeGo hỗ trợ doanh nghiệp tìm kiếm nhà sản xuất phù hợp, xác minh năng lực nhà máy, đàm phán điều khoản hợp tác và kiểm soát chất lượng sản phẩm trước khi xuất xưởng, giúp giảm thiểu rủi ro và tối ưu hiệu quả trong chuỗi cung ứng.\n        \u003c/p>\n        \u003cdiv class=\"hero-actions\">\n          \u003ca href=\"#contact-form\" class=\"btn-orange\">\n            Trao đổi nhu cầu ↗\n          \u003c/a>\n          \u003ca href=\"tel:+84906828898\" class=\"hero-phone-link\">\n            (+84) 906 828 898\n          \u003c/a>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Cột phải: Ảnh kho hàng kệ cao tầng với overlay caption -->\n      \u003cdiv class=\"hero-right\">\n        \u003cdiv class=\"hero-visual-wrap\">\n          \u003cimg \n            src=\"assets/warehouse_hero.jpg\" \n            alt=\"Hệ thống kho bãi &amp; kiểm soát chất lượng SpeeGo Logistics\" \n            class=\"hero-img\"\n          >\n          \u003cdiv class=\"hero-overlay-caption\">\n            \u003cdiv class=\"hero-overlay-tag\">SPEEGO LOGISTICS\u003c/div>\n            \u003cdiv class=\"hero-overlay-text\">Từ nhà máy đến thị trường toàn cầu\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 2. THANH ANCHOR-LINK NGANG DƯỚI HERO -->\n  \u003cnav class=\"anchor-bar\">\n    \u003cdiv class=\"container anchor-inner\">\n      \u003cdiv class=\"anchor-links-left\">\n        \u003ca href=\"#why-speego\" class=\"anchor-link\">Vì sao SpeeGo\u003c/a>\n        \u003ca href=\"#quality-control\" class=\"anchor-link\">Kiểm soát chất lượng\u003c/a>\n        \u003ca href=\"#categories\" class=\"anchor-link\">Ngành hàng\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"anchor-links-right\">\n        \u003ca href=\"#contact-form\" class=\"anchor-link-right\">\n          Tư vấn nguồn hàng ↗\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/nav>\n\n  \u003c!-- 3. SECTION \"VÌ SAO CHỌN SPEEGO\" (GRID 6 CARDS: 3 CỘT X 2 HÀNG) -->\n  \u003csection class=\"why-section\" id=\"why-speego\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"why-header\">\n        \u003cspan class=\"section-tag\">VÌ SAO CHỌN SPEEGO\u003c/span>\n        \u003ch2 class=\"section-title\">\n          Tìm nguồn hàng &amp; kiểm soát\u003cbr>\n          chất lượng toàn diện.\n        \u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"cards-grid-3x2\">\n        \u003c!-- Card 01 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">01\u003c/span>\n          \u003ch3 class=\"card-title\">Mạng lưới đối tác rộng lớn\u003c/h3>\n          \u003cp class=\"card-desc\">SpeeGo có đội ngũ tìm nguồn hàng và hệ thống đối tác mọi lĩnh vực\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 02 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">02\u003c/span>\n          \u003ch3 class=\"card-title\">Đánh giá nhà máy chất lượng nhất\u003c/h3>\n          \u003cp class=\"card-desc\">Đánh giá năng lực sản xuất, lựa chọn nhà máy phù hợp từng khách hàng\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 03 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">03\u003c/span>\n          \u003ch3 class=\"card-title\">Đàm phán giá và MOQ phù hợp\u003c/h3>\n          \u003cp class=\"card-desc\">Hỗ trợ đàm phán giá phù hợp và lượng đặt hàng tối thiểu phù hợp với nhu cầu\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 04 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">04\u003c/span>\n          \u003ch3 class=\"card-title\">Theo dõi &amp; cập nhật tiến độ sản xuất\u003c/h3>\n          \u003cp class=\"card-desc\">Cập nhật liên tục bằng hình ảnh, video, mẫu sản phẩm, tiến độ sản xuất\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 05 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">05\u003c/span>\n          \u003ch3 class=\"card-title\">Kiểm tra chất lượng (QC)\u003c/h3>\n          \u003cp class=\"card-desc\">Đảm bảo chất lượng sản phẩm đầu ra đáp ứng đủ tiêu chuẩn chất lượng\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 06 -->\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">06\u003c/span>\n          \u003ch3 class=\"card-title\">Vận chuyển &amp; fulfillment (nếu cần)\u003c/h3>\n          \u003cp class=\"card-desc\">Vận chuyển quốc tế &amp; lưu kho fulfillment nếu khách hàng có nhu cầu\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 4. SECTION \"QUALITY CONTROL\" (NỀN XANH NAVY ĐẬM) -->\n  \u003csection class=\"qc-section\" id=\"quality-control\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"qc-header\">\n        \u003cspan class=\"section-tag\">QUALITY CONTROL\u003c/span>\n        \u003ch2 class=\"section-title section-title-white\">\n          Chất lượng được kiểm soát\u003cbr>\n          ở từng giai đoạn.\n        \u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"qc-grid\">\n        \u003cdiv class=\"qc-col\">\n          \u003cdiv class=\"qc-num\">01\u003c/div>\n          \u003ch3 class=\"qc-title\">Kiểm tra trước sản xuất\u003c/h3>\n          \u003cp class=\"qc-desc\">Đảm bảo nguyên vật liệu và quy trình đáp ứng yêu cầu.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"qc-col\">\n          \u003cdiv class=\"qc-num\">02\u003c/div>\n          \u003ch3 class=\"qc-title\">Kiểm tra trong quá trình sản xuất\u003c/h3>\n          \u003cp class=\"qc-desc\">Phát hiện lỗi sớm để giảm chi phí khắc phục.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"qc-col\">\n          \u003cdiv class=\"qc-num\">03\u003c/div>\n          \u003ch3 class=\"qc-title\">Kiểm tra trước khi xuất hàng\u003c/h3>\n          \u003cp class=\"qc-desc\">Đánh giá sản phẩm trước khi đóng gói và giao đi.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"qc-col\">\n          \u003cdiv class=\"qc-num\">04\u003c/div>\n          \u003ch3 class=\"qc-title\">Báo cáo QC\u003c/h3>\n          \u003cp class=\"qc-desc\">Khách hàng nhận: Sample, Hình ảnh, Video, Báo cáo chi tiết, Danh sách lỗi (nếu có)\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 5. SECTION \"NGÀNH HÀNG\" -->\n  \u003csection class=\"categories-section\" id=\"categories\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"categories-header\">\n        \u003cspan class=\"section-tag\">NGÀNH HÀNG\u003c/span>\n        \u003ch2 class=\"section-title\">\n          Hiểu sản phẩm.\u003cbr>\n          Kết nối đúng nhà sản xuất.\n        \u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"categories-grid\">\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">01\u003c/span>\n          \u003ch3 class=\"card-title\">Mỹ phẩm\u003c/h3>\n          \u003cp class=\"card-desc\">SpeeGo Logistics cung cấp giải pháp end-to-end cho ngành mỹ phẩm từ tìm nguồn, sản xuất đến vận chuyển\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">02\u003c/span>\n          \u003ch3 class=\"card-title\">Nails\u003c/h3>\n          \u003cp class=\"card-desc\">SpeeGo Logistics chuyên sỉ, sản xuất, order đa dạng nguyên liệu, dụng cụ và phụ kiện nails chất lượng cao\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">03\u003c/span>\n          \u003ch3 class=\"card-title\">Decor, nội thất\u003c/h3>\n          \u003cp class=\"card-desc\">SpeeGo Logistics chuyên cung ứng đồ decor nội thất, trang trí cửa hàng, tiệm nails, spa, nhà hàng, đến không gian sống và làm việc\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">04\u003c/span>\n          \u003ch3 class=\"card-title\">Thủ công mỹ nghệ\u003c/h3>\n          \u003cp class=\"card-desc\">SpeeGo Logistics chuyên cung cấp các mặt hàng đồ thủ công mỹ nghệ mang đậm nét truyền thống dân tộc\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"feature-card\">\n          \u003cspan class=\"card-num\">05\u003c/span>\n          \u003ch3 class=\"card-title\">Thiết bị kỹ thuật\u003c/h3>\n          \u003cp class=\"card-desc\">Trao đổi với SpeeGo để lựa chọn giải pháp phù hợp với nhu cầu của doanh nghiệp.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style=\"display: flex; justify-content: flex-start; margin-top: 8px;\">\n        \u003ca href=\"#contact-form\" class=\"btn-orange\">\n          Tư vấn ngành hàng của bạn ↗\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 6. SECTION FAQ CÂU HỎI THƯỜNG GẶP (ACCORDION) -->\n  \u003csection class=\"faq-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"faq-header\">\n        \u003cspan class=\"section-tag\">CÂU HỎI THƯỜNG GẶP\u003c/span>\n        \u003ch2 class=\"section-title\">Câu hỏi thường gặp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"faq-list\">\n        \u003c!-- FAQ 1 -->\n        \u003cdiv class=\"faq-item\">\n          \u003cbutton class=\"faq-question-btn\" type=\"button\">\n            \u003cspan>SpeeGo có hỗ trợ đàm phán MOQ không?\u003c/span>\n            \u003cspan class=\"faq-icon\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Có. SpeeGo trực tiếp làm việc với các nhà xưởng đối tác để thương lượng số lượng đặt hàng tối thiểu (MOQ) phù hợp với quy mô và ngân sách thử nghiệm của bạn mà vẫn đảm bảo đơn giá cạnh tranh nhất.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 2 -->\n        \u003cdiv class=\"faq-item\">\n          \u003cbutton class=\"faq-question-btn\" type=\"button\">\n            \u003cspan>Tôi có thể theo dõi tiến độ sản xuất như thế nào?\u003c/span>\n            \u003cspan class=\"faq-icon\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Đội ngũ SpeeGo tại xưởng liên tục cập nhật tiến độ định kỳ hàng tuần kèm hình ảnh và video thực tế. Mọi số liệu và mốc thời gian đều được số hóa minh bạch giúp bạn nắm bắt 24/7.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 3 -->\n        \u003cdiv class=\"faq-item\">\n          \u003cbutton class=\"faq-question-btn\" type=\"button\">\n            \u003cspan>Báo cáo QC bao gồm những gì?\u003c/span>\n            \u003cspan class=\"faq-icon\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Báo cáo kiểm định QC chuẩn AQL của SpeeGo bao gồm: đo lường thông số kích thước, kiểm tra chất liệu, chức năng thực tế, quy cách đóng gói tem nhãn barcode và hình ảnh chi tiết các lỗi phát hiện (nếu có).\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 4 -->\n        \u003cdiv class=\"faq-item\">\n          \u003cbutton class=\"faq-question-btn\" type=\"button\">\n            \u003cspan>Sau khi kiểm tra, SpeeGo có hỗ trợ vận chuyển trọn gói không?\u003c/span>\n            \u003cspan class=\"faq-icon\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Hoàn toàn có. SpeeGo cung cấp giải pháp End-to-End trọn gói từ kiểm hàng xưởng, đóng gói tiêu chuẩn xuất khẩu, thủ tục hải quan cho tới vận chuyển đường biển/hàng không và fulfillment kho bãi tại Mỹ, Canada, Úc.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 7. SECTION TESTIMONIAL (NỀN XÁM XANH BĂNG NHẠT) -->\n  \u003csection class=\"testimonial-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"testimonial-header\">\n        \u003cspan class=\"section-tag\">KHÁCH HÀNG SPEEGO\u003c/span>\n        \u003ch2 class=\"section-title\">Đồng hành cùng doanh nghiệp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"testimonial-block\">\n        \u003csvg class=\"quote-icon\" viewBox=\"0 0 24 24\">\n          \u003cpath d=\"M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z\"/>\n        \u003c/svg>\n        \u003cdiv class=\"testimonial-content\">\n          \u003cblockquote class=\"quote-text\">\n            “Đội ngũ QC tại chỗ đã giúp chúng tôi tiết kiệm hàng nghìn đô la trước khi container được niêm phong.”\n          \u003c/blockquote>\n          \u003cdiv class=\"author-info\">\n            \u003cdiv class=\"author-name\">Kevin Le\u003c/div>\n            \u003cdiv class=\"author-role\"> CEO, Glamour Nail Supplies • California, USA\u003c/div>\n          \u003c/div>\n          \u003ca href=\"#\" class=\"case-study-link\">\n            Theo chia sẻ trên website SpeeGo • bản dịch tiếng Việt ↗\n          \u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 8. CTA FORM CUỐI TRANG (GỌI PARTIAL BIẾN THỂ \"band\") -->\n  \u003cdiv data-component=\"cta-form\" \n       data-variant=\"band\" \n       data-tag=\"LET'S MOVE FORWARD\"\n       data-heading=\"Bắt đầu từ nhu cầu\u003cbr>của bạn.\" \n       data-subtext=\"Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp.\u003cbr> SpeeGo sẽ tư vấn giải pháp phù hợp.\" \n       data-phone=\"(+84) 906828898 ↗\">\n  \u003c/div>\n\n\u003c/div>\n", "pages/tuyen_van_chuyen/en-tuyen-van-chuyen.html": "\u003cscript>\n  // Auto redirect to full application shell if opened directly from File Explorer\n  if (typeof window !== 'undefined' && !document.getElementById('app-main')) {\n    window.location.replace('../../index.html#/en/shipping-routes');\n  }\n\u003c/script>\n\n\u003cdiv class=\"page-container page-shipping-routes\"\n     data-page=\"en-shipping-routes\"\n     data-nav=\"shipping-routes\"\n     data-breadcrumb='[{\"label\":\"Home\",\"href\":\"#/en/knowledge\"},{\"label\":\"Shipping Routes from China\",\"href\":\"#/en/shipping-routes\"}]'>\n\n  \u003c!-- 1. HERO SECTION (2 COLUMNS) -->\n  \u003csection class=\"page-hero-2col\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"hero-2col-grid\">\n        \u003c!-- Left Column: Title & Intro -->\n        \u003cdiv class=\"hero-2col-left\">\n          \u003cdiv class=\"hero-tag-bar\">INTERNATIONAL FREIGHT\u003c/div>\n          \u003ch1 class=\"hero-h1-clean\" id=\"routeHeroTitle\">\n            Freight forwarding from\u003cbr>\n            \u003cspan id=\"routeOriginName\">China\u003c/span>\u003cbr>\n            \u003cspan class=\"text-orange\">to US, Canada &amp; Australia\u003c/span>\n          \u003c/h1>\n          \u003cp class=\"hero-desc-clean\" id=\"routeHeroDesc\">\n            Supporting Full Container Load (FCL) and Less than Container Load (LCL) freight from \u003cspan id=\"routeOriginDescName\">China\u003c/span> to the US, Canada, and Australia, accommodating the dynamic needs of businesses at any scale.\n          \u003c/p>\n          \u003cdiv class=\"hero-actions-row\">\n            \u003ca href=\"#contact-form\" class=\"btn-orange\">\n              Discuss Your Needs ↗\n            \u003c/a>\n            \u003ca href=\"tel:+84906828898\" class=\"hero-phone-label\">\n              (+84) 906 828 898\n            \u003c/a>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Right Column: SpeeGo Warehouse Facility Image -->\n        \u003cdiv class=\"hero-2col-right\">\n          \u003cdiv class=\"hero-img-card-wrap\">\n            \u003cimg src=\"assets/warehouse_hero.jpg\" alt=\"Connecting goods. Expanding markets.\" onerror=\"this.onerror=null; this.src='assets/port_sunset_hero.jpg';\">\n            \u003cdiv class=\"hero-img-caption-bar\">\n              \u003cdiv class=\"hero-caption-brand\">SPEEGO LOGISTICS\u003c/div>\n              \u003cdiv class=\"hero-caption-sub\">Connecting goods. Expanding markets.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 2. ORIGIN SWITCHER TABS (CHINA ⟷ VIETNAM) -->\n  \u003cdiv class=\"route-tabs-container\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"route-tab-pills\">\n        \u003cbutton type=\"button\" class=\"route-tab-btn active\" id=\"tabOriginChina\" onclick=\"switchRouteOriginEn('china')\">\n          Origin: China\n        \u003c/button>\n        \u003cbutton type=\"button\" class=\"route-tab-btn\" id=\"tabOriginVietnam\" onclick=\"switchRouteOriginEn('vietnam')\">\n          Origin: Vietnam\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 3. SHIPPING CORRIDORS (4 DESTINATION CARDS) -->\n  \u003csection class=\"route-dest-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">SHIPPING CORRIDORS\u003c/span>\n        \u003ch2 class=\"section-title\">Your business destinations.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"dest-cards-grid\">\n        \u003c!-- Card US -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>US\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteUS\">China ➔ United States\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card CA -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>CA\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteCA\">China ➔ Canada\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card AU -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>AU\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteAU\">China ➔ Australia\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card GLOBAL -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>GLOBAL\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteGlobal\">China ➔ Other Countries\u003c/div>\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 4. 8-STEP WORKFLOW (DARK NAVY #04243D) -->\n  \u003csection class=\"process-8steps-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\" style=\"color: var(--speego-accent);\">8-STEP WORKFLOW\u003c/span>\n        \u003ch2 class=\"section-title\" style=\"color: #FFFFFF;\">\n          Clear steps.\u003cbr>\n          End-to-end connectivity.\n        \u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"process-8steps-grid\">\n        \u003c!-- Step 01 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">01\u003c/div>\n          \u003cdiv class=\"step-8-title\">Requirement Intake\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Record commodity details, origin, and destination requirements.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 02 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">02\u003c/div>\n          \u003cdiv class=\"step-8-title\">Solution Advisory\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Select the optimal route balancing budget and transit timeline.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 03 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">03\u003c/div>\n          \u003cdiv class=\"step-8-title\">Sourcing Network\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Connect with verified factories and suppliers upon request.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 04 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">04\u003c/div>\n          \u003cdiv class=\"step-8-title\">Production Monitoring\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Track production milestones aligned with client delivery schedules.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 05 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">05\u003c/div>\n          \u003cdiv class=\"step-8-title\">Quality Control\u003c/div>\n          \u003cdiv class=\"step-8-desc\">On-site quality inspection before packaging and factory dispatch.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 06 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">06\u003c/div>\n          \u003cdiv class=\"step-8-title\">Documentation &amp; Clearance\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Prepare complete dossiers and handle customs export-import procedures.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 07 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">07\u003c/div>\n          \u003cdiv class=\"step-8-title\">Global Transportation\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Execute multi-modal transit via agreed air, ocean, or overland routes.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Step 08 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">08\u003c/div>\n          \u003cdiv class=\"step-8-title\">Completion &amp; Handover\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Finalize delivery and hand over all commercial &amp; customs documentation.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 5. TRANSPORTATION MODES (3 MODES) -->\n  \u003csection class=\"shipping-methods-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">TRANSPORTATION MODES\u003c/span>\n        \u003ch2 class=\"section-title\">Flexible transit methods.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"methods-3col-grid\">\n        \u003c!-- Mode 01 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">01\u003c/div>\n          \u003cdiv class=\"method-col-title\">Ocean Freight (FCL &amp; LCL)\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Mode 02 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">02\u003c/div>\n          \u003cdiv class=\"method-col-title\">Air Freight Services\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Mode 03 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">03\u003c/div>\n          \u003cdiv class=\"method-col-title\">Overland Trucking\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 6. WHY CHOOSE SPEEGO (5 CARDS LIGHT GRAY BACKGROUND) -->\n  \u003csection class=\"ie-why-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">WHY CHOOSE SPEEGO\u003c/span>\n        \u003ch2 class=\"section-title\">Partnering on your global journey.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ie-why-grid\">\n        \u003c!-- Card 01 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">01\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Reliable Transit Time\u003c/h3>\n          \u003cp class=\"ie-card-body\">Estimated from 7 days via air freight and 30 days via ocean freight. Exact schedules confirmed per lane and shipment.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 02 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">02\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Cost Optimization\u003c/h3>\n          \u003cp class=\"ie-card-body\">Tailored routing and transparent quotations aligned with your business volume and budget.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 03 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">03\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Multi-modal Flexibility\u003c/h3>\n          \u003cp class=\"ie-card-body\">Select the optimal freight mode matched to your product sensitivity, timeline, and delivery requirements.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 04 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">04\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">US Warehousing &amp; Fulfillment\u003c/h3>\n          \u003cp class=\"ie-card-body\">Direct connection to SpeeGo's 10,000 ft² Houston facility for storage and order fulfillment across North America.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 05 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">05\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">US Corporate Entity\u003c/h3>\n          \u003cp class=\"ie-card-body\">Incorporated business presence and operations in Texas, providing seamless cross-border coordination.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 7. FREIGHT RATE TRANSPARENCY -->\n  \u003csection class=\"route-rate-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">TRANSPARENT PRICING\u003c/span>\n        \u003ch2 class=\"section-title\">Shipping Rate Inquiries\u003c/h2>\n        \u003cp class=\"ff-section-sub\">Fixed public tariffs are not listed here. Contact SpeeGo to receive customized quotations per consignment.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"rate-table-card\">\n        \u003c!-- Row 1: Air Freight -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Air Freight\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Based on chargeable weight and destination airport\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Get a Quote ↗\u003c/a>\n        \u003c/div>\n\n        \u003c!-- Row 2: Ocean Freight · FCL -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Ocean Freight · FCL\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Based on container type (20ft/40ft/HQ), port of origin &amp; destination\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Get a Quote ↗\u003c/a>\n        \u003c/div>\n\n        \u003c!-- Row 3: Ocean Freight · LCL -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Ocean Freight · LCL\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Based on cargo volume (CBM), commodity classification, and trade lane\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Get a Quote ↗\u003c/a>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"rate-table-footnote\">Inquire with our team for itemized quotes and specialized handling requests.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 8. FREQUENTLY ASKED QUESTIONS (FAQ ACCORDION) -->\n  \u003csection class=\"ff-faq-section\" style=\"background: #FFFFFF;\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">USEFUL INFORMATION\u003c/span>\n        \u003ch2 class=\"section-title\">Frequently Asked Questions\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-faq-list\">\n        \u003c!-- FAQ 1 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Which destination markets does SpeeGo support?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo focuses primarily on the United States (US), Canada (CA), and Australia (AU), alongside an extensive global partner network connecting additional markets worldwide.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 2 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Can I ship Less-than-Container Load (LCL) consignments?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Yes. SpeeGo provides consolidated LCL ocean freight and air cargo solutions for small to medium batches, optimizing logistics expenses.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 3 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Are transit times guaranteed?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Transit durations depend on the transport mode (~7 days for air, ~30 days for ocean), weather conditions, and seasonal carrier schedules.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 4 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>What information is required to receive a quote?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Simply share product descriptions, estimated weight/dimensions, origin city, and target destination via our contact form or hotline.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 5 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Can I bundle shipping with US fulfillment?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Absolutely. Once customs clearance is completed, cargo can be delivered directly to SpeeGo's 10,000 ft² Houston warehouse for storage and multi-channel order fulfillment.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 9. TESTIMONIAL SECTION -->\n  \u003csection class=\"ff-testimonial-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">SPEEGO CLIENTS\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Growing with our partners\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-testimonial-card\">\n        \u003cdiv class=\"ff-quote-mark\" aria-hidden=\"true\">\n          \u003cspan>\u003c/span>\u003cspan>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ff-quote-body\">\n          \u003cblockquote class=\"ff-quote-text\">\n            “Real-time OMS tracking and a zero-hidden-fee policy have made SpeeGo our most reliable supply chain partner.”\n          \u003c/blockquote>\n          \u003cdiv class=\"ff-author-info\">\n            \u003cdiv class=\"ff-author-name\">Sarah Mitchell\u003c/div>\n            \u003cdiv class=\"ff-author-title\">Operations Director, EcoLiving Home · Australia\u003c/div>\n            \u003cdiv class=\"ff-author-ref\">\n              \u003ca href=\"#/en/sourcing\" class=\"ff-ref-link\">Customer story on SpeeGo website ↗\u003c/a>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 10. CONSULTATION FORM BAND -->\n  \u003cdiv data-component=\"cta-form\" data-variant=\"band\" id=\"contact-form\">\u003c/div>\n\n  \u003c!-- SCRIPT: ORIGIN TAB SWITCHER (CHINA ⟷ VIETNAM) -->\n  \u003cscript>\n    function switchRouteOriginEn(origin) {\n      const btnChina = document.getElementById('tabOriginChina');\n      const btnVietnam = document.getElementById('tabOriginVietnam');\n      const originName = document.getElementById('routeOriginName');\n      const descOriginName = document.getElementById('routeOriginDescName');\n      const destUS = document.getElementById('destRouteUS');\n      const destCA = document.getElementById('destRouteCA');\n      const destAU = document.getElementById('destRouteAU');\n      const destGlobal = document.getElementById('destRouteGlobal');\n      const breadcrumbList = document.getElementById('breadcrumbList');\n\n      if (origin === 'vietnam') {\n        if (btnChina) btnChina.classList.remove('active');\n        if (btnVietnam) btnVietnam.classList.add('active');\n        if (originName) originName.textContent = 'Vietnam';\n        if (descOriginName) descOriginName.textContent = 'Vietnam';\n        if (destUS) destUS.textContent = 'Vietnam ➔ United States';\n        if (destCA) destCA.textContent = 'Vietnam ➔ Canada';\n        if (destAU) destAU.textContent = 'Vietnam ➔ Australia';\n        if (destGlobal) destGlobal.textContent = 'Vietnam ➔ Other Countries';\n\n        // Update breadcrumb\n        if (breadcrumbList) {\n          breadcrumbList.innerHTML = `\n            \u003ca href=\"#/en/knowledge\" class=\"breadcrumb-link\">Home\u003c/a>\n            \u003cspan class=\"breadcrumb-sep\">/\u003c/span>\n            \u003cspan class=\"breadcrumb-current\">Shipping Routes from Vietnam\u003c/span>\n          `;\n        }\n      } else {\n        if (btnVietnam) btnVietnam.classList.remove('active');\n        if (btnChina) btnChina.classList.add('active');\n        if (originName) originName.textContent = 'China';\n        if (descOriginName) descOriginName.textContent = 'China';\n        if (destUS) destUS.textContent = 'China ➔ United States';\n        if (destCA) destCA.textContent = 'China ➔ Canada';\n        if (destAU) destAU.textContent = 'China ➔ Australia';\n        if (destGlobal) destGlobal.textContent = 'China ➔ Other Countries';\n\n        // Update breadcrumb\n        if (breadcrumbList) {\n          breadcrumbList.innerHTML = `\n            \u003ca href=\"#/en/knowledge\" class=\"breadcrumb-link\">Home\u003c/a>\n            \u003cspan class=\"breadcrumb-sep\">/\u003c/span>\n            \u003cspan class=\"breadcrumb-current\">Shipping Routes from China\u003c/span>\n          `;\n        }\n      }\n    }\n    window.switchRouteOriginEn = switchRouteOriginEn;\n  \u003c/script>\n\n\u003c/div>\n", "pages/tuyen_van_chuyen/tuyen-van-chuyen.html": "\u003cscript>\n  // Tự động chuyển hướng sang khung ứng dụng đầy đủ nếu mở trực tiếp từ File Explorer\n  if (typeof window !== 'undefined' && !document.getElementById('app-main')) {\n    window.location.replace('../../index.html#/tuyen-van-chuyen');\n  }\n\u003c/script>\n\n\u003cdiv class=\"page-container page-shipping-routes\"\n     data-page=\"tuyen-van-chuyen\"\n     data-nav=\"shipping-routes\"\n     data-breadcrumb='[{\"label\":\"Trang chủ\",\"href\":\"#/sourcing\"},{\"label\":\"Tuyến vận chuyển từ Trung Quốc\",\"href\":\"#/tuyen-van-chuyen\"}]'>\n\n  \u003c!-- 1. HERO SECTION (2 COLUMNS) -->\n  \u003csection class=\"page-hero-2col\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"hero-2col-grid\">\n        \u003c!-- Cột trái: Tiêu đề & giới thiệu -->\n        \u003cdiv class=\"hero-2col-left\">\n          \u003cdiv class=\"hero-tag-bar\">INTERNATIONAL FREIGHT\u003c/div>\n          \u003ch1 class=\"hero-h1-clean\" id=\"routeHeroTitle\">\n            Dịch vụ vận chuyển từ\u003cbr>\n            \u003cspan id=\"routeOriginName\">Trung Quốc\u003c/span>\u003cbr>\n            \u003cspan class=\"text-orange\">đến Mỹ, Canada &amp; Úc\u003c/span>\n          \u003c/h1>\n          \u003cp class=\"hero-desc-clean\" id=\"routeHeroDesc\">\n            Hỗ trợ vận chuyển hàng nguyên container (FCL), hàng lẻ (LCL) từ \u003cspan id=\"routeOriginDescName\">Trung Quốc\u003c/span> đến Mỹ, Canada và Úc, đáp ứng linh hoạt nhu cầu của doanh nghiệp ở mọi quy mô.\n          \u003c/p>\n          \u003cdiv class=\"hero-actions-row\">\n            \u003ca href=\"#contact-form\" class=\"btn-orange\">\n              Trao đổi nhu cầu ↗\n            \u003c/a>\n            \u003ca href=\"tel:+84906828898\" class=\"hero-phone-label\">\n              (+84) 906 828 898\n            \u003c/a>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Cột phải: Ảnh nhà xưởng kho bãi SpeeGo -->\n        \u003cdiv class=\"hero-2col-right\">\n          \u003cdiv class=\"hero-img-card-wrap\">\n            \u003cimg src=\"assets/warehouse_hero.jpg\" alt=\"Kết nối hàng hóa. Mở rộng thị trường.\" onerror=\"this.onerror=null; this.src='assets/port_sunset_hero.jpg';\">\n            \u003cdiv class=\"hero-img-caption-bar\">\n              \u003cdiv class=\"hero-caption-brand\">SPEEGO LOGISTICS\u003c/div>\n              \u003cdiv class=\"hero-caption-sub\">Kết nối hàng hóa. Mở rộng thị trường.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 2. ORIGIN SWITCHER TABS (TRUNG QUỐC ⟷ VIỆT NAM) -->\n  \u003cdiv class=\"route-tabs-container\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"route-tab-pills\">\n        \u003cbutton type=\"button\" class=\"route-tab-btn active\" id=\"tabOriginChina\" onclick=\"switchRouteOrigin('china')\">\n          Xuất phát từ Trung Quốc\n        \u003c/button>\n        \u003cbutton type=\"button\" class=\"route-tab-btn\" id=\"tabOriginVietnam\" onclick=\"switchRouteOrigin('vietnam')\">\n          Xuất phát từ Việt Nam\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 3. CÁC TUYẾN VẬN CHUYỂN (4 DESTINATION CARDS) -->\n  \u003csection class=\"route-dest-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">CÁC TUYẾN VẬN CHUYỂN\u003c/span>\n        \u003ch2 class=\"section-title\">Điểm đến của doanh nghiệp bạn.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"dest-cards-grid\">\n        \u003c!-- Card US -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>US\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteUS\">Trung Quốc ➔ Mỹ\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card CA -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>CA\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteCA\">Trung Quốc ➔ Canada\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card AU -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>AU\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteAU\">Trung Quốc ➔ Úc\u003c/div>\n        \u003c/a>\n\n        \u003c!-- Card GLOBAL -->\n        \u003ca href=\"#contact-form\" class=\"dest-card-item\">\n          \u003cdiv class=\"dest-card-header\">\n            \u003cspan>GLOBAL\u003c/span>\n            \u003cspan class=\"dest-arrow\">↗\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"dest-card-title\" id=\"destRouteGlobal\">Trung Quốc ➔ Nước khác\u003c/div>\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 4. QUY TRÌNH 8 BƯỚC (NỀN XANH NAVY #04243D) -->\n  \u003csection class=\"process-8steps-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\" style=\"color: var(--speego-accent);\">QUY TRÌNH 8 BƯỚC\u003c/span>\n        \u003ch2 class=\"section-title\" style=\"color: #FFFFFF;\">\n          Từng bước rõ ràng.\u003cbr>\n          Toàn trình kết nối.\n        \u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"process-8steps-grid\">\n        \u003c!-- Bước 01 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">01\u003c/div>\n          \u003cdiv class=\"step-8-title\">Tiếp nhận yêu cầu\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Ghi nhận thông tin hàng hóa, điểm đi và điểm đến.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 02 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">02\u003c/div>\n          \u003cdiv class=\"step-8-title\">Tư vấn giải pháp\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Lựa chọn phương án phù hợp với chi phí và tiến độ.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 03 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">03\u003c/div>\n          \u003cdiv class=\"step-8-title\">Kết nối nguồn hàng\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Hỗ trợ nhà máy và nguồn hàng khi có nhu cầu.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 04 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">04\u003c/div>\n          \u003cdiv class=\"step-8-title\">Theo dõi sản xuất\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Cập nhật tiến độ theo kế hoạch của khách hàng.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 05 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">05\u003c/div>\n          \u003cdiv class=\"step-8-title\">Kiểm tra chất lượng\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Kiểm tra trước khi đóng gói và xuất xưởng.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 06 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">06\u003c/div>\n          \u003cdiv class=\"step-8-title\">Chuẩn bị chứng từ\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Hoàn thiện hồ sơ và hỗ trợ thủ tục hải quan.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 07 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">07\u003c/div>\n          \u003cdiv class=\"step-8-title\">Vận chuyển quốc tế\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Vận chuyển theo phương thức đã thống nhất.\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Bước 08 -->\n        \u003cdiv class=\"step-8-item\">\n          \u003cdiv class=\"step-8-num\">08\u003c/div>\n          \u003cdiv class=\"step-8-title\">Hoàn tất &amp; bàn giao\u003c/div>\n          \u003cdiv class=\"step-8-desc\">Hoàn tất giao dịch và bàn giao chứng từ liên quan.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 5. GIẢI PHÁP VẬN CHUYỂN (3 PHƯƠNG THỨC) -->\n  \u003csection class=\"shipping-methods-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">GIẢI PHÁP VẬN CHUYỂN\u003c/span>\n        \u003ch2 class=\"section-title\">Linh hoạt phương thức vận chuyển.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"methods-3col-grid\">\n        \u003c!-- Phương thức 01 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">01\u003c/div>\n          \u003cdiv class=\"method-col-title\">Vận chuyển đường biển\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Phương thức 02 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">02\u003c/div>\n          \u003cdiv class=\"method-col-title\">Vận chuyển đường hàng không\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Phương thức 03 -->\n        \u003cdiv class=\"method-col-item\">\n          \u003cdiv class=\"method-col-num\">03\u003c/div>\n          \u003cdiv class=\"method-col-title\">Vận chuyển đường bộ\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 6. VÌ SAO CHỌN SPEEGO (5 CARDS NỀN XÁM NHẠT) -->\n  \u003csection class=\"ie-why-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">VÌ SAO CHỌN SPEEGO\u003c/span>\n        \u003ch2 class=\"section-title\">Đồng hành trên hành trình quốc tế.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ie-why-grid\">\n        \u003c!-- Card 01 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">01\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Thời gian vận chuyển\u003c/h3>\n          \u003cp class=\"ie-card-body\">Tham khảo từ 7 ngày với đường hàng không và 30 ngày với đường biển. Lịch cụ thể được xác nhận theo tuyến và từng lô hàng.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 02 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">02\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Hỗ trợ chi phí tối đa cho khách hàng\u003c/h3>\n          \u003cp class=\"ie-card-body\">Tư vấn phương án vận chuyển và báo giá theo nhu cầu thực tế của khách hàng.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 03 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">03\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Đa dạng phương thức\u003c/h3>\n          \u003cp class=\"ie-card-body\">Lựa chọn phương thức phù hợp với loại hàng, ngân sách và yêu cầu giao nhận.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 04 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">04\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Fulfillment tại Mỹ\u003c/h3>\n          \u003cp class=\"ie-card-body\">Kết nối lưu kho và xử lý đơn hàng để hỗ trợ hoạt động bán hàng tại thị trường Mỹ.\u003c/p>\n        \u003c/div>\n\n        \u003c!-- Card 05 -->\n        \u003cdiv class=\"ie-service-card\">\n          \u003cdiv class=\"ie-badge-box\">05\u003c/div>\n          \u003ch3 class=\"ie-card-h3\">Hiện diện tại Mỹ\u003c/h3>\n          \u003cp class=\"ie-card-body\">Có công ty và pháp nhân tại Mỹ để khách hàng yên tâm phối hợp.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 7. BẢNG GIÁ VẬN CHUYỂN -->\n  \u003csection class=\"route-rate-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">CHI PHÍ MINH BẠCH\u003c/span>\n        \u003ch2 class=\"section-title\">Bảng giá vận chuyển\u003c/h2>\n        \u003cp class=\"ff-section-sub\">Hiện chưa có mức giá cố định được công bố tại đây. Liên hệ SpeeGo để nhận báo giá theo lô hàng.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"rate-table-card\">\n        \u003c!-- Dòng 1: Đường hàng không -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Đường hàng không\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Theo trọng lượng tính cước và điểm đến\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Nhận báo giá ↗\u003c/a>\n        \u003c/div>\n\n        \u003c!-- Dòng 2: Đường biển · FCL -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Đường biển · FCL\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Theo loại container, cảng đi và cảng đến\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Nhận báo giá ↗\u003c/a>\n        \u003c/div>\n\n        \u003c!-- Dòng 3: Đường biển · LCL -->\n        \u003cdiv class=\"rate-table-row\">\n          \u003cdiv class=\"rate-col-name\">Đường biển · LCL\u003c/div>\n          \u003cdiv class=\"rate-col-desc\">Theo thể tích, loại hàng và tuyến vận chuyển\u003c/div>\n          \u003ca href=\"#contact-form\" class=\"rate-col-action\">Nhận báo giá ↗\u003c/a>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"rate-table-footnote\">Liên hệ để nhận báo giá chi tiết cho lô hàng và yêu cầu dịch vụ cụ thể.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 8. CÂU HỎI THƯỜNG GẶP (FAQ ACCORDION) -->\n  \u003csection class=\"ff-faq-section\" style=\"background: #FFFFFF;\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"section-header\">\n        \u003cspan class=\"section-tag\">THÔNG TIN HỮU ÍCH\u003c/span>\n        \u003ch2 class=\"section-title\">Câu hỏi thường gặp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-faq-list\">\n        \u003c!-- FAQ 1 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>SpeeGo hỗ trợ những điểm đến nào?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo tập trung vào 3 thị trường chính là Mỹ (US), Canada (CA) và Úc (AU), cùng mạng lưới kết nối đến nhiều quốc gia khác theo yêu cầu của doanh nghiệp.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 2 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Có thể gửi hàng lẻ không?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Có. SpeeGo cung cấp dịch vụ gom hàng lẻ (LCL) đường biển và vận chuyển hàng không cho các lô hàng có quy mô nhỏ, giúp tối ưu chi phí.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 3 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Thời gian vận chuyển có cố định không?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Thời gian phụ thuộc vào phương thức vận chuyển (hàng không ~7 ngày, đường biển ~30 ngày) và điều kiện thời tiết, lịch trình của hãng tàu / hàng không thực tế.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 4 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Tôi cần cung cấp gì để nhận báo giá?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Quý khách chỉ cần cung cấp loại hàng hóa, trọng lượng/kích thước ước tính, điểm đi và điểm đến mong muốn qua form tư vấn hoặc hotline.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- FAQ 5 -->\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Có thể kết hợp fulfillment tại Mỹ không?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Hoàn toàn được. Hàng sau khi thông quan tại Mỹ có thể được chuyển thẳng về kho 10,000 ft² của SpeeGo tại Houston, Texas để lưu kho và xử lý đơn hàng bán lẻ.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 9. TESTIMONIAL SECTION -->\n  \u003csection class=\"ff-testimonial-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">KHÁCH HÀNG SPEEGO\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Đồng hành cùng doanh nghiệp\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-testimonial-card\">\n        \u003cdiv class=\"ff-quote-mark\" aria-hidden=\"true\">\n          \u003cspan>\u003c/span>\u003cspan>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ff-quote-body\">\n          \u003cblockquote class=\"ff-quote-text\">\n            “Việc theo dõi OMS theo thời gian thực và chính sách không có chi phí ẩn khiến SpeeGo trở thành đối tác chuỗi cung ứng đáng tin cậy của chúng tôi.”\n          \u003c/blockquote>\n          \u003cdiv class=\"ff-author-info\">\n            \u003cdiv class=\"ff-author-name\">Sarah Mitchell\u003c/div>\n            \u003cdiv class=\"ff-author-title\">Operations Director, EcoLiving Home · Australia\u003c/div>\n            \u003cdiv class=\"ff-author-ref\">\n              \u003ca href=\"#/sourcing\" class=\"ff-ref-link\">Theo chia sẻ trên website SpeeGo · bản dịch tiếng Việt ↗\u003c/a>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 10. CONSULTATION FORM BAND -->\n  \u003cdiv data-component=\"cta-form\" data-variant=\"band\" id=\"contact-form\">\u003c/div>\n\n  \u003c!-- SCRIPT: ORIGIN TAB SWITCHER (TRUNG QUỐC ⟷ VIỆT NAM) -->\n  \u003cscript>\n    function switchRouteOrigin(origin) {\n      const btnChina = document.getElementById('tabOriginChina');\n      const btnVietnam = document.getElementById('tabOriginVietnam');\n      const originName = document.getElementById('routeOriginName');\n      const descOriginName = document.getElementById('routeOriginDescName');\n      const destUS = document.getElementById('destRouteUS');\n      const destCA = document.getElementById('destRouteCA');\n      const destAU = document.getElementById('destRouteAU');\n      const destGlobal = document.getElementById('destRouteGlobal');\n      const breadcrumbList = document.getElementById('breadcrumbList');\n\n      if (origin === 'vietnam') {\n        if (btnChina) btnChina.classList.remove('active');\n        if (btnVietnam) btnVietnam.classList.add('active');\n        if (originName) originName.textContent = 'Việt Nam';\n        if (descOriginName) descOriginName.textContent = 'Việt Nam';\n        if (destUS) destUS.textContent = 'Việt Nam ➔ Mỹ';\n        if (destCA) destCA.textContent = 'Việt Nam ➔ Canada';\n        if (destAU) destAU.textContent = 'Việt Nam ➔ Úc';\n        if (destGlobal) destGlobal.textContent = 'Việt Nam ➔ Nước khác';\n\n        // Update breadcrumb\n        if (breadcrumbList) {\n          breadcrumbList.innerHTML = `\n            \u003ca href=\"#/sourcing\" class=\"breadcrumb-link\">Trang chủ\u003c/a>\n            \u003cspan class=\"breadcrumb-sep\">/\u003c/span>\n            \u003cspan class=\"breadcrumb-current\">Tuyến vận chuyển từ Việt Nam\u003c/span>\n          `;\n        }\n      } else {\n        if (btnVietnam) btnVietnam.classList.remove('active');\n        if (btnChina) btnChina.classList.add('active');\n        if (originName) originName.textContent = 'Trung Quốc';\n        if (descOriginName) descOriginName.textContent = 'Trung Quốc';\n        if (destUS) destUS.textContent = 'Trung Quốc ➔ Mỹ';\n        if (destCA) destCA.textContent = 'Trung Quốc ➔ Canada';\n        if (destAU) destAU.textContent = 'Trung Quốc ➔ Úc';\n        if (destGlobal) destGlobal.textContent = 'Trung Quốc ➔ Nước khác';\n\n        // Update breadcrumb\n        if (breadcrumbList) {\n          breadcrumbList.innerHTML = `\n            \u003ca href=\"#/sourcing\" class=\"breadcrumb-link\">Trang chủ\u003c/a>\n            \u003cspan class=\"breadcrumb-sep\">/\u003c/span>\n            \u003cspan class=\"breadcrumb-current\">Tuyến vận chuyển từ Trung Quốc\u003c/span>\n          `;\n        }\n      }\n    }\n    window.switchRouteOrigin = switchRouteOrigin;\n  \u003c/script>\n\n\u003c/div>\n", "pages/xuat_nhap_khau/en-xuat-nhap-khau.html": "\u003cscript>\n  // Auto redirect to full application shell if opened directly from File Explorer\n  if (typeof window !== 'undefined' && !document.getElementById('app-main')) {\n    window.location.replace('../../index.html#/en/import-export');\n  }\n\u003c/script>\n\n\u003cdiv class=\"page-container page-import-export\"\n     data-page=\"en-import-export\"\n     data-nav=\"import-export\"\n     data-breadcrumb='[{\"label\":\"Home\",\"href\":\"#/en/knowledge\"},{\"label\":\"Import & Export\",\"href\":\"#/en/import-export\"}]'>\n\n  \u003c!-- 1. HERO SECTION (2 COLUMNS: TEXT LEFT, CARD IMAGE RIGHT) -->\n  \u003csection class=\"page-hero-2col\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"hero-2col-grid\">\n        \u003c!-- Left Column: Title, Intro & Actions -->\n        \u003cdiv class=\"hero-2col-left\">\n          \u003cdiv class=\"hero-tag-bar\">IMPORT &amp; EXPORT\u003c/div>\n       // In-memory cache for loaded partials and pages
      const cache = {
        headerHtml: null,

      let currentLang = 'vi';

            // 2. HELPER: FETCH WITH OFFLINE BUNDLE FALLBACK (file:/// & network offline)
      async function fetchText(url) {
        // Return from memory cache if available
        if (cache.pages && cache.pages[url]) {
          return cache.pages[url];
        }

        // Under local file:/// protocol, use offline bundle directly to prevent browser CORS block
        if (window.location.protocol === 'file:' && typeof OFFLINE_BUNDLE !== 'undefined' && OFFLINE_BUNDLE[url]) {
          return OFFLINE_BUNDLE[url];
        }

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          return await response.text();
        } catch (err) {
          if (typeof OFFLINE_BUNDLE !== 'undefined' && OFFLINE_BUNDLE[url]) {
            console.warn(`Fetch blocked or offline for [${url}], using embedded bundle fallback.`);
            return OFFLINE_BUNDLE[url];
          }
          console.error(`Error loading resource [${url}]:`, err);
          throw err;
        }
      }

      // 3. LOAD & INITIALIZE SHARED PARTIALS
      async function loadPartials() {
        try {
          // Parallel fetch header, footer, and cta-form
          const [header, footer, ctaForm] = await Promise.all([
            fetchText('partials/header.html'),
            fetchText('partials/footer.html'),
            fetchText('partials/cta-form.html')
          ]);

          cache.headerHtml = header;
          cache.footerHtml = footer;
          cache.ctaFormHtml = ctaForm;

          // Inject into DOM
          const headerContainer = document.getElementById('header-container');
          const footerContainer = document.getElementById('footer-container');

          if (headerContainer) headerContainer.innerHTML = header;
          if (footerContainer) footerContainer.innerHTML = footer;

          // Parse CTA Form templates into memory
          parseCtaTemplates(ctaForm);

          // Bind header and footer global interactions
          bindHeaderInteractions();
          return true;
        } catch (err) {
          renderErrorScreen('Lỗi nạp component dùng chung (partials)', err);
          return false;
        }
      }

      function renderCtaComponents(container) {
        const lang = currentLang || 'vi';
        const i18n = CTA_I18N[lang] || CTA_I18N.vi;

        const ctaPlaceholders = container.querySelectorAll('[data-component="cta-form"]');
        ctaPlaceholders.forEach(el => {
          const variant = el.getAttribute('data-variant') || 'band';
          const heading = el.getAttribute('data-heading') || (variant === 'band' ? i18n.defaultHeadingBand : i18n.defaultHeadingSidebar);
          const subtext = el.getAttribute('data-subtext') || i18n.defaultSubtext;
          const phone = el.getAttribute('data-phone') || i18n.phone;
          const tag = el.getAttribute('data-tag') || i18n.tag;

          let templateStr = ctaTemplates[variant] || ctaTemplates.band || '';
          if (templateStr) {
            const renderedHtml = templateStr
              .replace(/{{TAG}}/g, tag)
              .replace(/{{HEADING}}/g, heading)
              .replace(/{{SUBTEXT}}/g, subtext)
              .replace(/{{PHONE}}/g, phone)
              .replace(/{{LABEL_NAME}}/g, i18n.labelName)
              .replace(/{{PLACEHOLDER_NAME}}/g, i18n.placeholderName)
              .replace(/{{LABEL_EMAIL}}/g, i18n.labelEmail)
              .replace(/{{PLACEHOLDER_EMAIL}}/g, i18n.placeholderEmail)
              .replace(/{{LABEL_PHONE}}/g, i18n.labelPhone)
              .replace(/{{PLACEHOLDER_PHONE}}/g, i18n.placeholderPhone)
              .replace(/{{LABEL_MESSAGE}}/g, i18n.labelMessage)
              .replace(/{{PLACEHOLDER_MESSAGE}}/g, i18n.placeholderMessage)
              .replace(/{{BTN_SUBMIT}}/g, i18n.btnSubmit)
              .replace(/{{SECURITY_NOTE}}/g, i18n.securityNote);

            el.outerHTML = renderedHtml;
          }
        });
      }

      // 6. RENDER DYNAMIC BREADCRUMB
      function renderBreadcrumb(items) {
        const listEl = document.getElementById('breadcrumbList');
        if (!listEl) return;

        if (!items || !items.length) {
          listEl.innerHTML = '';
          return;
        }

        let html = '';
        items.forEach((item, index) => {
          const isLast = index === items.length - 1;
          if (isLast) {
            html += `<span class="breadcrumb-current">${item.label}</span>`;
          } else {
            html += `<a href="${index === 0 ? '/' : item.href}" class="breadcrumb-link">${item.label}</a>`;
            html += `<span class="breadcrumb-sep">/</span>`;
          }
        });

        listEl.innerHTML = html;
      }

      function bindHeaderInteractions() {

        function openDrawer() {
