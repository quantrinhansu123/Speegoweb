      // 11. ROUTE DISPATCHER
      async function router() {
        let hash = window.location.hash;
        
        // Normalize empty or root hashes to default route
        if (!hash || hash === '#' || hash === '#/') {
          window.location.hash = '#/knowledge';
          return;
        }

        // Support alias: #/knowledge1 -> #/knowledge
        if (hash === '#/knowledge1' || hash === '#knowledge') {
          window.location.hash = '#/knowledge';
          return;
        }

        const route = ROUTES[hash] || ROUTES['#/knowledge'];
        currentLang = route.lang || 'vi';

        // Update document title
        if (route.title) {
          document.title = route.title;
        }

        // Update Shell / Wrapper components for current language
        updateShellLanguage(currentLang);

        const appMain = document.getElementById('app-main');
        if (!appMain) return;

        // Show loading state
        appMain.innerHTML = `
          <div class="app-loading-state">
            <div class="loading-spinner"></div>
            <div>${currentLang === 'en' ? 'Loading page...' : 'Đang tải trang...'}</div>
          </div>
        `;

        try {
          // Fetch or get from cache
          let pageHtml = cache.pages[route.file];
          if (!pageHtml) {
            pageHtml = await fetchText(route.file);
            cache.pages[route.file] = pageHtml;
          }

          // Inject into main
          appMain.innerHTML = pageHtml;

          // Parse page-level metadata
          const pageContainer = appMain.querySelector('.page-container');
          let breadcrumbs = [];
          let navKey = route.nav;

          if (pageContainer) {
            const rawBreadcrumbs = pageContainer.getAttribute('data-breadcrumb');
            if (rawBreadcrumbs) {
              try {
                breadcrumbs = JSON.parse(rawBreadcrumbs);
              } catch (e) {
                console.error('Invalid breadcrumb JSON:', e);
              }
            }
            const pageNav = pageContainer.getAttribute('data-nav');
            if (pageNav) navKey = pageNav;
          }

          // Update breadcrumbs and active nav menu
          renderBreadcrumb(breadcrumbs);
          updateNavHighlights(navKey);

          // Render any nested CTA Form components
          renderCtaComponents(appMain);

          // Re-bind interactive events (FAQ accordion, pills)
          bindPageInteractions();

          // Scroll to top
          window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (err) {
          renderErrorScreen(`Không thể tải trang [${route.file}]`, err);
        }
      }

      // 12. INITIALIZATION
      async function init() {
        const partialsLoaded = await loadPartials();
        if (partialsLoaded) {
          window.addEventListener('hashchange', router);
          router();
        }
      }

      // Run on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();

    function calculateFulfillmentCost() {
      const weightInput = document.getElementById('calcWeight');
      const zoneSelect = document.getElementById('calcZone');
      const lengthInput = document.getElementById('calcLength');
      const widthInput = document.getElementById('calcWidth');
      const heightInput = document.getElementById('calcHeight');
      const pkgSelect = document.getElementById('calcPkg');

      if (!weightInput || !lengthInput || !widthInput || !heightInput) return;

      const actualWeight = parseFloat(weightInput.value) || 1;
      const l = parseFloat(lengthInput.value) || 10;
      const w = parseFloat(widthInput.value) || 6;
      const h = parseFloat(heightInput.value) || 4;
      const zone = parseInt(zoneSelect ? zoneSelect.value : '1', 10) || 1;
      const pkg = pkgSelect ? pkgSelect.value : 'poly';

      // Volumetric weight (lbs) = (L * W * H in inches) / 139
      const volWeight = (l * w * h) / 139;
      const billableWeight = Math.max(actualWeight, volWeight);

      const resWeight = document.getElementById('calcResultWeight');
      const resAio = document.getElementById('calcResultAio');
      const resPkg = document.getElementById('calcResultPkg');
      const resShip = document.getElementById('calcResultShip');
      const resTotal = document.getElementById('calcResultTotal');

      if (resWeight) resWeight.textContent = `${billableWeight.toFixed(2)} lbs`;

      const isEn = (document.documentElement.lang === 'en');
      const includedText = isEn ? 'Included' : 'Đã bao gồm';

      let total = 7.00;
      let aioText = '$7.00';
      let pkgText = includedText;
      let shipText = includedText;

      let extraPkgCost = 0;
      if (pkg === 'bubble') { extraPkgCost = 0.50; pkgText = '+$0.50'; }
      else if (pkg === 'carton_s') { extraPkgCost = 1.00; pkgText = '+$1.00'; }
      else if (pkg === 'carton_m') { extraPkgCost = 1.50; pkgText = '+$1.50'; }
      else if (pkg === 'carton_l') { extraPkgCost = 1.70; pkgText = '+$1.70'; }

      if (billableWeight <= 1.76) {
        total = 7.00 + extraPkgCost;
        aioText = '$7.00';
      } else if (billableWeight <= 5.5) {
        total = 10.00 + extraPkgCost;
        aioText = '$10.00';
      } else {
        let handlingFee = 2.50;
        if (billableWeight > 15 && billableWeight <= 30) handlingFee = 3.25;
        else if (billableWeight > 30 && billableWeight <= 50) handlingFee = 4.50;
        else if (billableWeight > 50 && billableWeight <= 70) handlingFee = 6.35;
        else if (billableWeight > 70 && billableWeight <= 100) handlingFee = 7.75;
        else if (billableWeight > 100) handlingFee = 10.00;

        const zoneFactor = 0.45 * zone;
        const weightFactor = (billableWeight - 1) * 0.85;
        const uspsRate = 5.20 + zoneFactor + weightFactor;
        total = handlingFee + uspsRate + extraPkgCost;

        aioText = `$${handlingFee.toFixed(2)}`;
        shipText = `$${uspsRate.toFixed(2)}`;
      }

      if (resAio) resAio.textContent = aioText;
      if (resPkg) resPkg.textContent = pkgText;
      if (resShip) resShip.textContent = shipText;
      if (resTotal) resTotal.textContent = `$${total.toFixed(2)}`;
    }
