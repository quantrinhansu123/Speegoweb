    /* Loading indicator & Error Card Styles */
    .app-loading-state {
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(242, 102, 28, 0.2);
      border-top-color: var(--orange-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-error-card {
      max-width: 640px;
      margin: 80px auto;
      background: #FFFFFF;
      border: 1px solid #FECACA;
      border-left: 6px solid #EF4444;
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .app-error-title {
      color: #991B1B;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-error-desc {
      color: #4B5563;
      font-size: 0.92rem;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .app-error-cmd {
      background: #1E293B;
      color: #38BDF8;
      font-family: monospace;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin: 12px 0 20px 0;
      user-select: all;
    }

    .btn-retry {
      background: var(--navy-main);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

thời trang.\n          \u003c/p>\n          \u003cdiv class=\"topic-article-list\">\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-orange\">\u003c/span>\n              \u003ca href=\"#/knowledge/kien-thuc-nganh-hang\" class=\"topic-article-link\">\n                Nail Products for the US, Canada &amp; Australia: Manufacturing, Export &amp; Supply Chain Insights\n              \u003c/a>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-orange\">\u003c/span>\n              \u003ca href=\"#/knowledge/kien-thuc-nganh-hang\" class=\"topic-article-link\">\n                Nail Product Manufacturing and Export to the US, Canada &amp; Australia\n              \u003c/a>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-orange\">\u003c/span>\n              \u003ca href=\"#/knowledge/kien-thuc-nganh-hang\" class=\"topic-article-link\">\n                Launching a Cosmetics Brand: From Idea to Global Market with SpeeGo Logistics\n              \u003c/a>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-gray\">\u003c/span>\n              \u003cspan class=\"topic-article-disabled\">Đang cập nhật\u003c/span>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"topic-card-footer\">\n            \u003ca href=\"#/knowledge/kien-thuc-nganh-hang\" class=\"topic-more-link\">Xem tất cả →\u003c/a>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Card 3: Tuyến thương mại -->\n        \u003cdiv class=\"topic-card\">\n          \u003cdiv class=\"topic-card-header\">\n            \u003ch3 class=\"topic-card-title\">Tuyến thương mại\u003c/h3>\n            \u003cspan class=\"topic-card-badge\">0 bài\u003c/span>\n          \u003c/div>\n          \u003cp class=\"topic-card-desc\">\n ic-article-list\">\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-orange\">\u003c/span>\n              \u003ca href=\"#/knowledge/kiem-soat-chat-luong\" class=\"topic-article-link\">\n                QC theo từng giai đoạn: kiểm soát chất lượng trước khi xuất hàng\n              \u003c/a>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-orange\">\u003c/span>\n              \u003ca href=\"#/knowledge/sourcing-qc\" class=\"topic-article-link\">\n                Top 05 Vietnam Sourcing Agents for Reliable Import &amp; Manufacturing\n              \u003c/a>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-gray\">\u003c/span>\n              \u003cspan class=\"topic-article-disabled\">Đang cập nhật\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"topic-article-item\">\n              \u003cspan class=\"bullet-icon-gray\">\u003c/span>\n              \u003cspan class=\"topic-article-disabled\">Đang cập nhật\u003c/span>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"topic-card-footer\">\n            \u003ca href=\"#/knowledge/sourcing-qc\" class=\"topic-more-link\">Xem tất cả →\u003c/a>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Card 5: Fulfillment & Kho vận -->\n        \u003cdiv class=\"topic-card\">\n          \u003cdiv class=\"topic-card-header\">\n            \u003ch3 class=\"topic-card-title\">Fulfillment &amp; Kho vận\u003c/h3>\n            \u003cspan class=\"topic-card-badge\">1 bài\u003c/span>\n          \u003c/div>\n          \u003cp class=\"topic-card-desc\">\n            Giải pháp thực tế cho lưu kho, xử lý đơn hàng, pick and pack và vận hành fulfillment, giúp doanh nghiệp quản lý đơn hàng hiệu quả và mở rộng vững vàng.\n          \u003c/p>\n          \u003cdiv class=\"topic-article-list\">\n ass=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Rào cản ngôn ngữ, khác biệt chuẩn mực kỹ thuật và khoảng cách địa lý khiến việc kiểm soát tiến độ và chất lượng gặp nhiều khó khăn. SpeeGo cung cấp đội ngũ chuyên gia tại chỗ để đại diện doanh nghiệp làm việc trực tiếp với nhà xưởng, thẩm định năng lực và đàm phán hợp đồng chặt chẽ.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Câu 2 -->\n        \u003cdiv class=\"faq-item\">\n          \u003cbutton class=\"faq-question-btn\" type=\"button\">\n            \u003cspan>Làm sao đảm bảo chất lượng sản phẩm khi tìm nguồn hàng ở nước ngoài?\u003c/span>\n            \u003cspan class=\"faq-icon\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"faq-answer\">\n            \u003cp class=\"faq-answer-text\">\n              Doanh nghiệp cần áp dụng quy trình kiểm định chất lượng (QC) nhiều lớp theo chuẩn quốc tế AQL: từ kiểm tra nguyên liệu đầu vào, giám sát trong quá trình sản xuất đến kiểm định ngẫu nhiên trước khi đóng container niêm phong xuất xưởng, kèm biên bản hình ảnh và video minh bạch.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 4. CTA FORM CUỐI TRANG: GỌI PARTIAL BIẾN THỂ \"band\" -->\n  \u003cdiv data-component=\"cta-form\" \n       data-variant=\"band\" \n       data-tag=\"LET'S MOVE FORWARD\"\n       data-heading=\"Bắt đầu từ nhu cầu\u003cbr>của bạn.\" \n       data-subtext=\"Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp. SpeeGo sẽ tư vấn giải pháp phù hợp.\" \n       data-phone=\"(+84) 906 828 898 ↗\">\n  \u003c/div>\n\n\u003c/div>\n", "pages/Knowledge/VI/vi-02-chuyenmuc-shipping-guides.html": "\u003c!-- ==========================================================================\n     PAGE: CHUYÊN MỤC HƯỚNG DẪN VẬN CHUYỂN (SHIPPING GUIDES) - VIETNAMESE\n     Metadata:\n     data-page=\"shipping-guides\"\n     data-nav=\"knowledg ection class=\"post-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"post-grid\">\n\n        \u003c!-- CỘT TRÁI (~65%): NỘI DUNG BÀI VIẾT -->\n        \u003carticle class=\"post-main\">\n          \u003c!-- Category tag & H1 -->\n          \u003cspan class=\"post-cat-tag\">KNOWLEDGE / Shipping guides\u003c/span>\n          \u003ch1 class=\"post-title\">Chuẩn bị lô hàng: bắt đầu từ những thông tin nào?\u003c/h1>\n\n          \u003c!-- Meta row & Share -->\n          \u003cdiv class=\"post-meta-row\">\n            \u003cspan>Ban biên tập SpeeGo\u003c/span>\n            \u003cspan>·\u003c/span>\n            \u003cspan>Cập nhật 17/09/2026\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"post-share-row\">\n            \u003cspan>Chia sẻ\u003c/span>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\">Facebook ↗\u003c/a>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\">LinkedIn ↗\u003c/a>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\" onclick=\"navigator.clipboard && navigator.clipboard.writeText(window.location.href); alert('Đã sao chép liên kết!');\">Sao chép liên kết\u003c/a>\n          \u003c/div>\n\n          \u003c!-- Hero Image -->\n          \u003cdiv class=\"post-hero-wrap\">\n            \u003cimg src=\"assets/warehouse_hero.jpg\" \n                 alt=\"Chuẩn bị lô hàng: bắt đầu từ những thông tin nào?\" \n                 class=\"post-hero-img\">\n          \u003c/div>\n\n          \u003c!-- Lead Paragraph -->\n          \u003cp class=\"post-lead-text\">\n            Một danh sách ngắn giúp doanh nghiệp trao đổi nhu cầu vận chuyển rõ ràng ngay từ đầu.\n          \u003c/p>\n\n          \u003c!-- Section 1 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Thông tin hàng hóa\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Chuẩn bị tên sản phẩm, số lượng, trọng lượng và kích thước đóng gói. Thông tin nhất quán giúp đội ngũ tư vấn hiểu đúng nhu cầu của lô hàng.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 2 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Điểm đi, điểm đến và thời gian\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Xác định địa chỉ nhận hàng, điểm giao hàng và thời gian mong muốn. Trao đổi các yêu cầu đặc biệt trước khi lựa chọn phương thức vận chuyển.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 3 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Lựa chọn phương thức\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              SpeeGo hỗ trợ hàng nguyên container FCL và hàng lẻ LCL, cùng các phương án đường biển, đường hàng không và đường bộ phù hợp với hành trình.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 4 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Xác nhận trước khi gửi\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Trao đổi với SpeeGo để thống nhất báo giá, lịch dự kiến, hồ sơ và đầu mối phụ trách trước khi giao hàng.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Author Bio -->\n          \u003cdiv class=\"post-author-bio\">\n            \u003cdiv class=\"post-author-avatar\">SG\u003c/div>\n            \u003cdiv class=\"post-author-info\">\n              \u003ch4 class=\"post-author-name\">Ban biên tập SpeeGo\u003c/h4>\n              \u003cp class=\"post-author-role\">Chia sẻ thông tin về dịch vụ sourcing, vận chuyển và fulfillment của SpeeGo Logistics.\u003c/p>\n              \u003cdiv class=\"post-author-links\">\n                \u003ca href=\"https://speegologistics.com\" target=\"_blank\" rel=\"noopener\">Website ↗\u003c/a>\n                \u003cspan>·\u003c/span>\n                \u003ca href=\"mailto:info@speegologistic.com\">Email ↗\u003c/a>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/article>\n\n        \u003c!-- CỘT PHẢI (~35%): SIDEBAR FORM + BÀI VIẾT QUAN TRỌNG -->\n        \u003caside class=\"post-sidebar\">\n          \u003c!-- CTA Form Sidebar -->\n          \u003cdiv data-component=\"cta-form\" \n               data-variant=\"sidebar\" \n               data-tag=\"LET'S MOVE FORWARD\"\n               data-heading=\"Bạn cần tư vấn?\" \n               data-subtext=\"Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp. SpeeGo sẽ tư vấn giải pháp phù hợp.\" \n               data-phone=\"(+84) 906 828 898 ↗\">\n          \u003c/div>\n\n          \u003c!-- Box Bài viết quan trọng của chủ đề -->\n          \u003cdiv class=\"topic-key-articles-card\">\n            \u003ch4 class=\"topic-key-title\">Bài viết quan trọng của chủ đề\u003c/h4>\n            \u003cdiv class=\"topic-key-list\">\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/quy-trinh-nhap-kho\">\n                  Từ barcode đến nhập kho: quy trình Fulfillment tại SpeeGo ↗\n                \u003c/a>\n              \u003c/div>\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/kiem-soat-chat-luong\">\n                  QC theo từng giai đoạn: kiểm soát chất lượng trước khi xuất hàng ↗\n                \u003c/a>\n              \u003c/div>\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/sourcing-qc\">\n                  Top 05 Vietnam Sourcing Agents for Reliable Import &amp; Manufacturing ↗\n                \u003c/a>\n              \u003c/div>\n              \u003cdiv class=\"topic-key-item\" style=\"margin-top: 6px; padding-top: 8px; border-top: 1px solid #F1F5F9;\">\n                \u003ca href=\"#/knowledge/huong-dan-van-chuyen\" class=\"topic-more-link\">\n                  Xem tất c 3cspan>Cập nhật 17/09/2026\u003c/span>\n          \u003c/div>\n\n          \u003cdiv class=\"post-share-row\">\n            \u003cspan>Chia sẻ\u003c/span>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\">Facebook ↗\u003c/a>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\">LinkedIn ↗\u003c/a>\n            \u003ca href=\"javascript:void(0)\" class=\"post-share-link\" onclick=\"navigator.clipboard && navigator.clipboard.writeText(window.location.href); alert('Đã sao chép liên kết!');\">Sao chép liên kết\u003c/a>\n          \u003c/div>\n\n          \u003c!-- Hero Image -->\n          \u003cdiv class=\"post-hero-wrap\">\n            \u003cimg src=\"assets/port_sunset_hero.jpg\" \n                 alt=\"Từ barcode đến nhập kho: quy trình Fulfillment tại SpeeGo\" \n                 class=\"post-hero-img\">\n          \u003c/div>\n\n          \u003c!-- Lead Paragraph -->\n          \u003cp class=\"post-lead-text\">\n            Hiểu 4 bước kết nối sản phẩm, tồn kho và đơn hàng trong cùng một quy trình.\n          \u003c/p>\n\n          \u003c!-- Section 1 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Xử lý barcode\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Tạo hoặc gán barcode cho từng sản phẩm. SpeeGo cung cấp file barcode khi khách hàng có nhu cầu.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 2 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Tạo yêu cầu nhập kho IR\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Chọn SKU và số lượng. OMS xác nhận và trả mã IR; in mã và dán lên kiện hàng trước khi gửi.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 3 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Tiếp nhận và kiểm tra\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Lô hàng được kiểm tra trước khi nhập kho. Tồn kho được cập nhật trên OMS để nhà bán hàng theo dõi.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 4 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Fulfillment và vận chuyển\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Đơn hàng được xử lý đóng gói có video ghi hình và kết nối vận chuyển qua USPS, UPS hoặc FedEx tùy yêu cầu.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Author Bio -->\n          \u003cdiv class=\"post-author-bio\">\n            \u003cdiv class=\"post-author-avatar\">SG\u003c/div>\n            \u003cdiv class=\"post-author-info\">\n              \u003ch4 class=\"post-author-name\">Ban biên tập SpeeGo\u003c/h4>\n              \u003cp class=\"post-author-role\">Chia sẻ thông tin về dịch vụ sourcing, vận chuyển và fulfillment của SpeeGo Logistics.\u003c/p>\n              \u003cdiv class=\"post-author-links\">\n                \u003ca href=\"https://speegologistics.com\" target=\"_blank\" rel=\"noopener\">Website ↗\u003c/a>\n                \u003cspan>·\u003c/span>\n                \u003ca href=\"mailto:info@speegologistic.com\">Email ↗\u003c/a>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/article>\n\n        \u003c!-- CỘT PHẢI (~35%): SIDEBAR FORM + BÀI VIẾT QUAN TRỌNG -->\n        \u003caside class=\"post-sidebar\">\n          \u003c!-- CTA Form Sidebar -->\n          \u003cdiv data-component=\"cta-form\" \n               data-variant=\"sidebar\" \n               data-tag=\"LET'S MOVE FORWARD\"\n               data-heading=\"Bạn cần tư vấn?\" \n               data-subtext=\"Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp. SpeeGo sẽ tư vấn giải pháp phù hợp.\" \n               data-phone=\"(+84) 906 828 898 ↗\">\n          \u003c/div>\n\n          \u003c!-- Box Bài viết quan trọng củ g\" \n                 alt=\"QC theo từng giai đoạn: kiểm soát chất lượng trước khi xuất hàng\" \n                 class=\"post-hero-img\">\n          \u003c/div>\n\n          \u003c!-- Lead Paragraph -->\n          \u003cp class=\"post-lead-text\">\n            Từ nguyên vật liệu đến báo cáo QC, những điểm kiểm tra giúp doanh nghiệp theo dõi chất lượng.\n          \u003c/p>\n\n          \u003c!-- Section 1 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Trước khi sản xuất\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Kiểm tra nguyên vật liệu và quy trình theo yêu cầu đã thống nhất.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 2 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Trong quá trình sản xuất\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Theo dõi và phát hiện lỗi sớm để giảm chi phí khắc phục.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 3 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Trước khi xuất hàng\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Đánh giá sản phẩm trước khi đóng gói và giao đi.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Section 4 -->\n          \u003cdiv class=\"post-content-block\">\n            \u003ch3 class=\"post-content-h2\">Báo cáo cho khách hàng\u003c/h3>\n            \u003cp class=\"post-content-p\">\n              Kết quả kiểm tra có thể bao gồm mẫu sản phẩm, hình ảnh, video, báo cáo chi tiết và danh sách lỗi nếu có.\n            \u003c/p>\n          \u003c/div>\n\n          \u003c!-- Author Bio -->\n          \u003cdiv class=\"post-author-bio\">\n            \u003cdiv class=\"post-author-avatar\">SG\u003c/div>\n            \u003cdiv class=\"post-author-info\">\n              \u003ch4 class=\"post-author-name\">Ban biên tập SpeeGo\u003c/h4>\n              \u003cp class=\"post-author-role\">Chia sẻ thông tin về dịch vụ sourcing, vận chuyển và fulfillment của SpeeGo Logistics.\u003c/p>\n              \u003cdiv class=\"post-author-links\">\n                \u003ca href=\"https://speegologistics.com\" target=\"_blank\" rel=\"noopener\">Website ↗\u003c/a>\n                \u003cspan>·\u003c/span>\n                \u003ca href=\"mailto:info@speegologistic.com\">Email ↗\u003c/a>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/article>\n\n        \u003c!-- CỘT PHẢI (~35%): SIDEBAR FORM + BÀI VIẾT QUAN TRỌNG -->\n        \u003caside class=\"post-sidebar\">\n          \u003c!-- CTA Form Sidebar -->\n          \u003cdiv data-component=\"cta-form\" \n               data-variant=\"sidebar\" \n               data-tag=\"LET'S MOVE FORWARD\"\n               data-heading=\"Bạn cần tư vấn?\" \n               data-subtext=\"Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp. SpeeGo sẽ tư vấn giải pháp phù hợp.\" \n               data-phone=\"(+84) 906 828 898 ↗\">\n          \u003c/div>\n\n          \u003c!-- Box Bài viết quan trọng của chủ đề -->\n          \u003cdiv class=\"topic-key-articles-card\">\n            \u003ch4 class=\"topic-key-title\">Bài viết quan trọng của chủ đề\u003c/h4>\n            \u003cdiv class=\"topic-key-list\">\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/sourcing-qc\">\n                  Top 05 Vietnam Sourcing Agents for Reliable Import &amp; Manufacturing ↗\n                \u003c/a>\n              \u003c/div>\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/quy-trinh-nhap-kho\">\n                  Từ barcode đến nhập kho: quy trình Fulfillment tại SpeeGo ↗\n                \u003c/a>\n              \u003c/div>\n              \u003cdiv class=\"topic-key-item\">\n                \u003ca href=\"#/knowledge/chuan-bi-lo- LMENT WORKFLOW\u003c/span>\n        \u003ch2 class=\"ff-section-title ff-title-white\">Five steps. One US-standard workflow.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-steps-grid\">\n        \u003c!-- Step 01 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">01\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Barcode setup\u003c/h3>\n          \u003cp class=\"ff-step-text\">Create or assign a barcode for each product. Barcode PDF files provided on request.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 02 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">02\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Inbound request (IR)\u003c/h3>\n          \u003cp class=\"ff-step-text\">Create an inbound request in the OMS: pick SKUs and quantities. The OMS confirms and returns an IR code to print and attach to each package.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 03 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">03\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Receiving, inspection &amp; put-away\u003c/h3>\n          \u003cp class=\"ff-step-text\">Every shipment is inspected before put-away. Inventory updates automatically in the OMS in real time.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 04 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">04\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Fulfillment &amp; shipping\u003c/h3>\n          \u003cp class=\"ff-step-text\">Orders are picked, packed with video records, and shipped via USPS, UPS, or FedEx.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 05 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">05\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Returns handling\u003c/h3>\n          \u003cp class=\"ff-step-text\">SpeeGo handles the full returns intake and processing workflow, free of charge on every order.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-process-cta\">\n        \u003ca href=\"#contact-form\" class=\"btn-orange\">\n          Discuss the workflow ↗\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 3. RATE CARD SECTION (SPEEGO FULFILLMENT RATE CARD) -->\n  \u003csection class=\"ff-pricing-section\" id=\"bang-gia-fulfillment\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">US SERVICE PRICING\u003c/span>\n        \u003ch2 class=\"ff-section-title\">SpeeGo Fulfillment rate card\u003c/h2>\n        \u003cp class=\"ff-section-sub\">\n          Open each group for the detailed rates. Special requests and any extras are confirmed before processing.\n        \u003c/p>\n      \u003c/div>\n\n      \u003c!-- Accordion Pricing List -->\n      \u003cdiv class=\"ff-pricing-accordion\">\n        \u003c!-- Accordion Item 01 (Open) -->\n        \u003cdiv class=\"ff-pricing-group active\" id=\"group-fulfill-pricing\">\n          \u003cdiv class=\"ff-pricing-header\" onclick=\"togglePricingGroup(this)\">\n            \u003cdiv class=\"ff-pricing-header-left\">\n              \u003cspan class=\"ff-pricing-badge\">01\u003c/span>\n              \u003cdiv>\n                \u003cdiv class=\"ff-pricing-group-title\">FULFILLMENT PRICING\u003c/div>\n                \u003cdiv class=\"ff-pricing-group-sub\">Fulfillment &amp; order handling\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"ff-pricing-toggle-icon\">✕\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"ff-pricing-body\">\n            \u003c!-- 2 Highlight All-in-one Cards -->\n            \u003cdiv class=\"ff-allinone-grid\">\n              \u003cdiv class=\"ff-allinone-card\">\n                \u003cdiv class=\"ff-aio-info\">\n                  \u ()\">\n            \u003c/div>\n            \u003cdiv class=\"ff-form-group\">\n              \u003clabel class=\"ff-label\">Zone\u003c/label>\n              \u003cselect id=\"calcZone\" class=\"ff-select\" onchange=\"calculateFulfillmentCost()\">\n                \u003coption value=\"1\" selected>Zone 1\u003c/option>\n                \u003coption value=\"2\">Zone 2\u003c/option>\n                \u003coption value=\"3\">Zone 3\u003c/option>\n                \u003coption value=\"4\">Zone 4\u003c/option>\n                \u003coption value=\"5\">Zone 5\u003c/option>\n                \u003coption value=\"6\">Zone 6\u003c/option>\n                \u003coption value=\"7\">Zone 7\u003c/option>\n                \u003coption value=\"8\">Zone 8\u003c/option>\n                \u003coption value=\"9\">Zone 9\u003c/option>\n              \u003c/select>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"ff-form-row-2\">\n            \u003cdiv class=\"ff-form-group\">\n              \u003clabel class=\"ff-label\">Length (in)\u003c/label>\n              \u003cinput type=\"number\" id=\"calcLength\" class=\"ff-input\" value=\"10\" min=\"1\" oninput=\"calculateFulfillmentCost()\">\n            \u003c/div>\n            \u003cdiv class=\"ff-form-group\">\n              \u003clabel class=\"ff-label\">Width (in)\u003c/label>\n              \u003cinput type=\"number\" id=\"calcWidth\" class=\"ff-input\" value=\"6\" min=\"1\" oninput=\"calculateFulfillmentCost()\">\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"ff-form-row-2\">\n            \u003cdiv class=\"ff-form-group\">\n              \u003clabel class=\"ff-label\">Height (in)\u003c/label>\n              \u003cinput type=\"number\" id=\"calcHeight\" class=\"ff-input\" value=\"4\" min=\"1\" oninput=\"calculateFulfillmentCost()\">\n            \u003c/div>\n            \u003cdiv class=\"ff-form-group\">\n              \u003clabel class=\"ff-label\">Packaging\u003c/label>\n              \u003cselect id=\"calcPkg\" class=\"ff-select\" onchange=\"calculateFulfillmentCost()\">\n                \u003coption value=\"poly\" selected>Poly mailer — free\u003c/option>\n                \u003coption value=\"bubble\">Bubble mailer (+$0.50)\u003c/option>\n                \u003coption value=\"carton_s\">Carton box 6x4x4 in (+$1.00)\u003c/option>\n                \u003coption value=\"carton_m\">Carton box 10x6x4 in (+$1.50)\u003c/option>\n                \u003coption value=\"carton_l\">Carton box 9x7x3 in (+$1.70)\u003c/option>\n                \u003coption value=\"custom\">Your own packaging (no handling fee)\u003c/option>\n              \u003c/select>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-calc-summary\">\n          \u003cdiv class=\"ff-summary-row\">\n            \u003cspan class=\"ff-summary-label\">Billable weight\u003c/span>\n            \u003cspan class=\"ff-summary-val\" id=\"calcResultWeight\">1.73 lbs\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-summary-row\">\n            \u003cspan class=\"ff-summary-label\">All-in-one package\u003c/span>\n            \u003cspan class=\"ff-summary-val\" id=\"calcResultAio\">$7.00\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-summary-row\">\n            \u003cspan class=\"ff-summary-label\">Packaging\u003c/span>\n            \u003cspan class=\"ff-summary-val\" id=\"calcResultPkg\">Included\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-summary-row\">\n            \u003cspan class=\"ff-summary-label\">USPS Ground Advantage\u003c/span>\n            \u003cspan class=\"ff-summary-val\" id=\"calcResultShip\">Included\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-summary-divider\">\u003c/div>\n          \u003cdiv class=\"ff-summary-total-row\">\n            \u003cspan class=\"ff-total-label\">Estimated total\u003c/span>\n            \u003cspan class=\"ff-total-val\" id=\"calcResultTotal\">$7.00\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cp class=\"ff-calc-footnote\">\n        Orders under 800 g use the all-in-one package. Estimates are indicative; final cost is confirmed per actual order.\n      \u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 5. INSIDE HOUSTON WAREHOUSE -->\n  \u003csection class=\"ff-warehouse-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-warehouse-header\">\n        \u003cdiv>\n          \u003cspan class=\"ff-tag-eyebrow\">INSIDE THE WAREHOUSE\u003c/span>\n          \u003ch2 class=\"ff-section-title\">Inside the Houston warehouse.\u003c/h2>\n        \u003c/div>\n        \u003cdiv class=\"ff-gallery-nav\">\n          \u003cbutton class=\"ff-gallery-arrow\" onclick=\"slideGallery(-1)\" aria-label=\"Previous slide\">←\u003c/button>\n          \u003cbutton class=\"ff-gallery-arrow\" onclick=\"slideGallery(1)\" aria-label=\"Next slide\">→\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-warehouse-slider-frame\" id=\"warehouseGallery\">\n        \u003c!-- Slide 0 -->\n        \u003cdiv class=\"ff-warehouse-slide active\" data-slide=\"0\">\n          \u003cimg src=\"assets/port_sunset_hero.jpg\" alt=\"Racking and storage zone Houston\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/warehouse_racks_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Racking &amp; storage zone\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Storage racking where each SKU is mapped to a fixed location in the OMS.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Slide 1 -->\n        \u003cdiv class=\"ff-warehouse-slide\" data-slide=\"1\">\n          \u003cimg src=\"assets/warehouse_hero.jpg\" alt=\"Packing stations and video log\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/warehouse_racks_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Packing stations &amp; HD video log\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Every package is packed under high-definition cameras synced to individual tracking numbers.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Slide 2 -->\n        \u003cdiv class=\"ff-warehouse-slide\" data-slide=\"2\">\n          \u003cimg src=\"assets/warehouse_racks_hero.jpg\" alt=\"Inbound and outbound docks\" class=\"ff-warehouse-img\" onerror=\"this.onerror=null; this.src='assets/port_sunset_hero.jpg';\">\n          \u003cdiv class=\"ff-slide-caption-card\">\n            \u003cdiv class=\"ff-caption-tag\">Inbound &amp; outbound docks\u003c/div>\n            \u003cdiv class=\"ff-caption-text\">Continuous loading dock bays directly integrated with USPS, UPS, and FedEx carrier pickups.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-slider-dots\">\n        \u003cspan class=\"ff-dot active\" onclick=\"setSlide(0)\">\u003c/span>\n        \u003cspan class=\"ff-dot\" onclick=\"setSlide(1)\">\u003c/span>\n        \u003cspan class=\"ff-dot\" onclick=\"setSlide(2)\">\u003c/span>\n      \u003c/div>\n\n      \u003cp class=\"ff-warehouse-footnote\">\n        Placeholder imagery — to be replaced with photographs of the Houston warehouse.\n      \u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 6. SERVICE POLICY SECTION -->\n  \u003csection class=\"ff-policy-section\" id=\"chinh-sach-fulfillment\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">SERVICE POLICY\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Fulfillment policy\u003c/h2>\n        \u003cp class=\"ff-section-sub\">\n          Each case below is assessed from the order record, valid documentation, and the reconciliation between the customer, the SpeeGo warehouse, and the carrier.\n        \u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-policy-list\">\n        \u003c!-- Item 01 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">01\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Goods lost in the warehouse\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>If warehouse inventory audits confirm goods are lost in storage, SpeeGo compensates based on the declared invoice value or actual purchase value verified with official documents.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 02 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">02\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Incorrect packing by the warehouse\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>If the warehouse ships the wrong SKU or incorrect quantity due to picking/packing error (verified by video logs), SpeeGo covers all reshipment and return shipping costs.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 03 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">03\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Wrong label or delivery address\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>In the event of label misprinting caused by SpeeGo systems, reprints and forwarding are free. If customer provided invalid address, we assist in rerouting per carrier policies.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 04 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">04\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Damage during packing or domestic transit\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>SpeeGo supports filing insurance claims with carriers (USPS/UPS/FedEx) and coordinates prompt reimbursement for business owners.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 05 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">05\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Marked \"Delivered\" but not received\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>Assistance with carrier carrier GPS delivery coordinates check and dispatching official location verification within 24–48 business hours.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Item 06 -->\n        \u003cdiv class=\"ff-policy-item\" onclick=\"togglePolicyItem(this)\">\n          \u003cdiv class=\"ff-policy-header\">\n            \u003cspan class=\"ff-policy-num\">06\u003c/span>\n            \u003cspan class=\"ff-policy-title\">Orders shipped later than the SLA\u003c/span>\n            \u003cspan class=\"ff-policy-icon\">+\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ff-policy-content\">\n            \u003cp>For orders not dispatched by SpeeGo within the agreed dispatch SLA, 100% of the fulfillment handling fee for that order will be refunded.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2 Claim Info Cards -->\n      \u003cdiv class=\"ff-claim-info-grid\">\n        \u003cdiv class=\"ff-claim-card\">\n          \u003cdiv class=\"ff-claim-card-tag\">FILING A CLAIM\u003c/div>\n          \u003cdiv class=\"ff-claim-card-title\">Submission deadlines\u003c/div>\n          \u003cdiv class=\"ff-claim-card-desc\">\n            \u003cstrong>Lost orders:\u003c/strong> Within 2 months of the carrier accepting the order.\u003cbr>\n            \u003cstrong>Damage, incorrect rates, or issues with the goods:\u003c/strong> Within 3 days of delivery to the recipient.\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-claim-card\">\n          \u003cdiv class=\"ff-claim-card-tag\">PROCESSING TIME\u003c/div>\n          \u003cdiv class=\"ff-claim-big-time\">10 business days\u003c/div>\n          \u003cdiv class=\"ff-claim-card-desc\">\n            Counted from receipt of the complete claim file for a shipment.\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 7. FREQUENTLY ASKED QUESTIONS SECTION -->\n  \u003csection class=\"ff-faq-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">HELPFUL INFORMATION\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Frequently asked questions\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-faq-list\">\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>How do I create an inbound request?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Create an Inbound Request (IR) directly via SpeeGo OMS, select SKU quantities, and attach the system-generated IR shipping label to each carton before sending them to Houston.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>How does SpeeGo support barcode setup?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo supports generating standard international barcodes or adopting your existing product barcodes. We provide printable PDF templates and onsite labeling services at the warehouse.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Where can I track inventory and orders?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>All stock levels, fulfillment milestones, and carrier tracking statuses are synced live 24/7 inside the SpeeGo online OMS portal.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Can I review how an order was packed?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>Yes. SpeeGo packing stations are equipped with high-definition video recording indexed by tracking ID for complete transparency during claims reconciliation.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>Which carriers handle orders?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>SpeeGo partners directly with leading US tier-1 carriers: USPS (optimized via Ground Advantage), UPS, and FedEx.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"ff-faq-item faq-item\">\n          \u003cbutton class=\"ff-faq-btn faq-question-btn\">\n            \u003cspan>How are returns handled?\u003c/span>\n            \u003cspan class=\"ff-faq-plus\">+\u003c/span>\n          \u003c/button>\n          \u003cdiv class=\"ff-faq-answer\">\n            \u003cp>When returns arrive at the Houston hub, our team inspects them, uploads photo reports to your OMS, and restocks eligible units into active inventory at no receiving charge.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 8. TESTIMONIAL SECTION -->\n  \u003csection class=\"ff-testimonial-section\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">SPEEGO CUSTOMERS\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Working alongside your business\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-testimonial-card\">\n        \u003cdiv class=\"ff-quote-mark\" aria-hidden=\"true\">\n          \u003cspan>\u003c/span>\u003cspan>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ff-quote-body\">\n          \u003cblockquote class=\"ff-quote-text\">\n            “The real-time OMS tracking and zero-hidden-costs policy make SpeeGo our most reliable supply chain partner.”\n          \u003c/blockquote>\n          \u003cdiv class=\"ff-author-info\">\n            \u003cdiv class=\"ff-author-nam 003cspan class=\"ff-tag-eyebrow ff-tag-light\">QUY TRÌNH FULFILLMENT\u003c/span>\n        \u003ch2 class=\"ff-section-title ff-title-white\">5 bước. Một quy trình chuẩn US.\u003c/h2>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-steps-grid\">\n        \u003c!-- Step 01 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">01\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Xử lý barcode\u003c/h3>\n          \u003cp class=\"ff-step-text\">Tạo hoặc gắn barcode cho từng sản phẩm. Cung cấp file PDF barcode nếu cần.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 02 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">02\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Yêu cầu nhập kho (IR)\u003c/h3>\n          \u003cp class=\"ff-step-text\">Tạo IR nhập kho trên OMS: chọn SKU và số lượng. OMS xác nhận và trả mã IR để in, dán lên kiện hàng.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 03 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">03\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Tiếp nhận, kiểm tra &amp; nhập kho\u003c/h3>\n          \u003cp class=\"ff-step-text\">Mỗi lô hàng được kiểm tra kỹ trước khi nhập kho. Tồn kho cập nhật tự động theo thời gian thực trên OMS.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 04 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">04\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Fulfillment &amp; vận chuyển\u003c/h3>\n          \u003cp class=\"ff-step-text\">Đơn hàng được xử lý, đóng gói có video ghi hình minh bạch và vận chuyển qua USPS, UPS hoặc FedEx.\u003c/p>\n        \u003c/div>\n        \u003c!-- Step 05 -->\n        \u003cdiv class=\"ff-step-item\">\n          \u003cdiv class=\"ff-step-num\">05\u003c/div>\n          \u003ch3 class=\"ff-step-name\">Xử lý hàng return\u003c/h3>\n          \u003cp class=\"ff-step-text\">Toàn bộ quy trình tiếp nhận và xử lý hàng hoàn trả do SpeeGo đảm nhận, miễn phí cho mọi đơn hàng.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ff-process-cta\">\n        \u003ca href=\"#contact-form\" class=\"btn-orange\">\n          Tư vấn quy trình Fulfillment ↗\n        \u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 3. RATE CARD SECTION (BẢNG BÁO GIÁ SPEEGO FULFILLMENT) -->\n  \u003csection class=\"ff-pricing-section\" id=\"bang-gia-fulfillment\">\n    \u003cdiv class=\"container\">\n      \u003cdiv class=\"ff-section-header\">\n        \u003cspan class=\"ff-tag-eyebrow\">BẢNG GIÁ DỊCH VỤ TẠI MỸ\u003c/span>\n        \u003ch2 class=\"ff-section-title\">Bảng báo giá SpeeGo Fulfillment\u003c/h2>\n        \u003cp class=\"ff-section-sub\">\n          Nhấn vào từng nhóm để mở hoặc thu gọn chi tiết. Yêu cầu đặc biệt hoặc phát sinh thực tế sẽ được xác nhận lại trước khi xử lý.\n        \u003c/p>\n      \u003c/div>\n\n      \u003c!-- Accordion Pricing List -->\n      \u003cdiv class=\"ff-pricing-accordion\">\n        \u003c!-- Accordion Item 01 (Open) -->\n        \u003cdiv class=\"ff-pricing-group active\" id=\"group-fulfill-pricing\">\n          \u003cdiv class=\"ff-pricing-header\" onclick=\"togglePricingGroup(this)\">\n            \u003cdiv class=\"ff-pricing-header-left\">\n              \u003cspan class=\"ff-pricing-badge\">01\u003c/span>\n              \u003cdiv>\n                \u003cdiv class=\"ff-pricing-group-title\">BẢNG GIÁ FULFILL\u003c/div>\n                \u003cdiv class=\"ff-pricing-group-sub\">Fulfillment &amp; xử lý đơn hàng\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"ff-pricing-toggle-icon\">✕\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"ff-pricing-body\">\n            \u003c!-- 2 Highlight All-in-one Cards -->\n            \u003cdiv class=\"ff-allinone-grid\">\n              \u003cdiv class=\"ff-allinone-card\">\n
