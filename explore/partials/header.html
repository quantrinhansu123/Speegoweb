<!-- =================================================================
     HEADER & MULTI-LANGUAGE NAVIGATION (Exact Design Spec from Web Tổng)
     ================================================================= -->
<header id="masthead" class="site-header speego-site-header" role="banner">
  <!-- ================================================================
     Top Bar: Hotline & Email
     ================================================================ -->
<div class="speego-header-topbar">
  <div class="speego-header-topbar-inner">

    <div
      class="speego-header-contact"
      aria-label="SpeeGo contact details"
    >

      <!-- Phone -->
      <details class="speego-header-contact-popover">
        <summary
          class="speego-header-contact-item"
          aria-label="Xem số điện thoại SpeeGo"
        >
          <svg
            class="speego-header-contact-icon speego-header-contact-icon-white"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/>
          </svg>

          <span class="speego-header-contact-val">
            (024) 6291 8618
          </span>
        </summary>

        <a
          class="speego-header-contact-popover-link"
          href="tel:+842462918618"
        >
          Gọi (024) 6291 8618
        </a>
      </details>

      <!-- Separator -->
      <span
        class="speego-header-contact-sep"
        aria-hidden="true"
      >|</span>

      <!-- Email -->
      <details class="speego-header-contact-popover">
        <summary
          class="speego-header-contact-item speego-header-contact-email"
          aria-label="Xem email SpeeGo"
        >
          <svg
            class="speego-header-contact-icon speego-header-contact-icon-white"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2"
            />
            <path d="m3 7 9 6 9-6"/>
          </svg>

          <span class="speego-header-contact-val">
            info@speegologistic.com
          </span>
        </summary>

        <a
          class="speego-header-contact-popover-link"
          href="mailto:info@speegologistic.com"
        >
          Gửi email info@speegologistic.com
        </a>
      </details>

    </div>

    <!-- Policy -->
    <div class="speego-policy-menu speego-topbar-policy">

      <button
        type="button"
        class="speego-policy-toggle"
        id="speegoPolicyToggle"
        aria-expanded="false"
        aria-controls="speego-policy-dropdown"
        data-i18n="policy_label"
      >
        Chính sách
      </button>

      <ul
        id="speego-policy-dropdown"
        class="speego-policy-dropdown"
        aria-label="Chính sách"
      >
        <li>
          <a
            href="/privacy-policy"
            id="policyPrivacyLink"
            data-i18n="policy_privacy"
          >
            Chính sách bảo mật
          </a>
        </li>

        <li>
          <a
            href="/terms-and-conditions"
            id="policyTermsLink"
            data-i18n="policy_terms"
          >
            Điều khoản &amp; Điều kiện
          </a>
        </li>
      </ul>

    </div>

  </div>
</div>

  <!-- Main Navigation Bar -->
  <div class="speego-header-navbar">
    <div class="speego-header-navbar-inner">
      <!-- Brand Logo -->
      <div class="site-branding speego-branding">
        <a href="/" class="speego-brand-logo" id="headerLogoLink" rel="home" title="Trang chủ SpeeGo Logistics">
          <img src="assets/speego-logo-dark.png" alt="SpeeGo Logistics" class="speego-logo-img">
        </a>
      </div>

      <!-- Navigation Menu -->
      <nav id="site-navigation" class="speego-main-navigation" role="navigation">
        <ul class="speego-nav-menu" id="menu-main-menu">
          <li class="speego-nav-item"><a href="/" class="speego-nav-link" id="navLinkHome">Homepage</a></li>
          <li class="speego-nav-item"><a href="/#why-speego" class="speego-nav-link" id="navLinkAbout" data-i18n="nav_about">About</a></li>
          <li class="speego-nav-item" data-nav="sourcing"><a href="#/sourcing" class="speego-nav-link" id="navLinkSourcing">Sourcing</a></li>
          <li class="speego-nav-item" data-nav="shipping-routes"><a href="#/tuyen-van-chuyen" class="speego-nav-link" id="navLinkRoutes">Logistics</a></li>
          <li class="speego-nav-item" data-nav="fulfillment"><a href="#/fulfillment" class="speego-nav-link" id="navLinkFulfillment">Fulfillment</a></li>
          <li class="speego-nav-item" data-nav="import-export"><a href="#/xuat-nhap-khau" class="speego-nav-link" id="navLinkImportExport">Import &amp; Export</a></li>
          <li class="speego-nav-item" data-nav="knowledge"><a href="#/knowledge" class="speego-nav-link" id="navLinkKnowledge">Knowledge</a></li>
          <li class="speego-nav-item speego-nav-cta-item">
            <a href="#contact-form" class="speego-nav-link speego-header-quote-btn" id="mHeaderCtaBtn">
              <span data-i18n="nav_quote_btn">Nhận báo giá</span>
              <svg class="speego-header-quote-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Header CTA & Language Switcher -->
      <div class="speego-header-cta-wrap">
        <!-- Language Dropdown (3 Languages: VN / EN / ES, Default: VN) -->
        <div class="speego-lang-selector" id="speegoLangSelector">
          <button type="button" class="speego-lang-btn" id="speego-lang-toggle" aria-expanded="false" aria-haspopup="listbox" aria-label="Chọn ngôn ngữ">
            <span class="speego-lang-flag-current" id="speego-current-lang-flag" aria-hidden="true">
              <img src="assets/flags/vn.png" alt="VN" class="speego-lang-flag" width="18" height="13">
            </span>
            <span class="speego-current-lang-text" id="speego-current-lang-text">VN</span>
            <svg class="speego-lang-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="speego-lang-dropdown" id="speego-lang-dropdown" role="listbox" aria-label="Danh sách ngôn ngữ">
            <button type="button" class="speego-lang-option active" data-lang="vi" role="option" aria-selected="true">
              <img src="assets/flags/vn.png" alt="VN" class="speego-lang-flag" width="18" height="13">
              <span>VN</span>
            </button>
            <button type="button" class="speego-lang-option" data-lang="en" role="option" aria-selected="false">
              <img src="assets/flags/us.png" alt="US" class="speego-lang-flag" width="18" height="13">
              <span>EN</span>
            </button>
            <button type="button" class="speego-lang-option" data-lang="es" role="option" aria-selected="false">
              <svg class="speego-lang-flag" viewBox="0 0 3 2" width="18" height="13" aria-hidden="true" style="border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,0.15);"><rect width="3" height="2" fill="#c60b1e"/><rect y="0.5" width="3" height="1" fill="#ffc400"/></svg>
              <span>ES</span>
            </button>
          </div>
        </div>

        <a href="#contact-form" class="speego-header-quote-btn" id="headerCtaBtn">
          <span data-i18n="nav_quote_btn">Nhận báo giá</span>
          <svg class="speego-header-quote-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

      <button class="speego-menu-toggle" id="mobileMenuOpen" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="Mở menu điều hướng">
        <span class="speego-menu-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

<!-- Dynamic Breadcrumb Container -->
<nav class="breadcrumb-section" id="breadcrumbSection" aria-label="Đường dẫn trang">
  <div class="container">
    <div class="breadcrumb-list" id="breadcrumbList">
      <!-- Breadcrumb items rendered dynamically via JS -->
    </div>
  </div>
</nav>
