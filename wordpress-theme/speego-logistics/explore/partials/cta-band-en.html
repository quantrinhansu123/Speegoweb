<section class="cta-form-band-section" id="contact-form">
    <div class="container cta-form-band-grid">
      <div class="cta-band-left">
        <span class="section-tag">LET'S MOVE FORWARD</span>
        <h2 class="section-title section-title-white">Start with what<br>you need.</h2>
        <p class="cta-band-desc">Tell us about your products and business plans. SpeeGo will help you find the right solution.</p>
        <a href="tel:+84906828898" class="cta-hotline-link">(+84) 906 828 898 ↗</a>
      </div>
      <div class="cta-band-right">
        <div class="consult-card-white">
          <form class="consult-form" onsubmit="handleConsultSubmit(event)">
            <div class="form-row-2col">
              <div class="form-group">
                <label class="form-label" for="band_fullName">Full name</label>
                <input type="text" id="band_fullName" name="fullName" class="form-control" placeholder="Your full name" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="band_email">Email</label>
                <input type="email" id="band_email" name="email" class="form-control" placeholder="you@company.com" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="band_phone">Phone number</label>
              <input type="tel" id="band_phone" name="phone" class="form-control" placeholder="Your contact number" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="band_message">How can we help?</label>
              <textarea id="band_message" name="message" class="form-control" placeholder="Product type, quantity, origin, and destination..."></textarea>
            </div>
            <button type="submit" class="btn-orange btn-submit">Draft an Inquiry ↗</button>
            <p class="form-security-note">Opens your email app with a prepared message. Your information is only sent when you click Send in your email app.</p>
          </form>
        </div>
      </div>
    </div>
  </section>
